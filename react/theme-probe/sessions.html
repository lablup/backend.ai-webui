<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sessions area probes (to-astryx ticket 17)</title>
    <script>
      // Minimal Backend.AI client stub so useSuspendedBackendaiClient
      // resolves immediately (see react/src/hooks backendaiClientPromise —
      // it reads globalThis.backendaiclient at module-import time).
      globalThis.backendaiclient = {
        ready: true,
        supports: function (key) {
          // Exercise the legacy (pre scheduling-history) status-tag branches
          // unless ?sched=1 is passed.
          if (key === 'session-scheduling-history') {
            return new URLSearchParams(location.search).get('sched') === '1';
          }
          return false;
        },
        isManagerVersionCompatibleWith: function () {
          return false;
        },
        _config: { hideAgents: true },
        full_name: 'Probe User',
        email: 'probe@backend.ai',
        user_uuid: 'probe-user-uuid',
        user: {
          get: function () {
            return Promise.resolve({ user: { role: 'user' } });
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/theme-probe/sessions.tsx"></script>
  </body>
</html>
