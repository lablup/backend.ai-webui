# Snapshot the docs SOURCE (markdown + book.config.yaml) at a specific
# release tag and commit + push it to a `docs-archive/<minor>` orphan
# branch (e.g., `docs-archive/26.4`).
#
# Why this exists (the FR-2729 v1 "overlay" archive model)
#   Each archive holds the *source* of a minor at the chosen release ref,
#   not its rendered output. At Amplify build time the current toolkit
#   on `main` re-renders every archive's source so all versions on the
#   live site share the same toolkit features (FR-2731 PDF card, FR-2733
#   selector + banner UX, etc.). FR-2710 F6's original intent was
#   "toolkit-of-its-day" (build once, freeze); FR-2729 inverted that
#   for v1 because shipping the same look across versions matters more
#   than perfectly reproducing each minor's contemporary toolkit. See
#   FR-2751 for follow-up build caching that makes this efficient at
#   archive count >= 2.
#
# Triggers (all resolve to a minor + a source ref, then snapshot):
#   1. push to a bare `<MAJOR>.<MINOR>` branch (e.g. `26.4`) touching
#      `src/**` — keeps the archive in step with docs fixes on that line.
#   2. release (published, non-prerelease) — seeds/refreshes the tag's
#      minor at publish time (fires even if no docs push landed).
#   3. workflow_dispatch — manual backfill / dry run of any ref + minor.
#
# Output: a `docs-archive/<minor>` branch containing ONLY:
#   src/                          # markdown + book.config.yaml
#   .archive-info.txt             # provenance sentinel
#   .gitattributes                # only when the source stores Git LFS pointers
# Orphan branches share no history with `main`, so the main repo size
# is unaffected. Each dispatch force-pushes — running for the same
# minor on a higher patch tag overwrites the archive with the new src.
#
# References:
#   - ADR:    docs/adr/0023-multi-version-docs-site-from-source-archive-branches.md
#   - v1 sub-task: FR-2738
#   - Predecessor (Done): FR-2710 F6 (versioned output layout)
#   - Follow-up: FR-2751 (per-archive build caching)

name: docs-archive-orphan-branch

on:
  push:
    # Bare `<MAJOR>.<MINOR>` release branches only. In GitHub filter
    # patterns `+` means "one or more", and the match is whole-ref
    # anchored, so `[0-9]+.[0-9]+` hits `26.4`/`25.15` but not `26.4.1`.
    branches:
      - "[0-9]+.[0-9]+"
    # Only when the archived docs source changed.
    paths:
      - "packages/backend.ai-webui-docs/src/**"
  release:
    # Minor derived from the tag in the resolve step; pre-releases skipped
    # by the job-level `if:`.
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref whose docs src/ to snapshot (tag or SHA, e.g. v26.4.7)"
        required: true
        type: string
      minor_label:
        description: "Minor label this archive represents (e.g. 26.4). MUST NOT include patch."
        required: true
        type: string
      dry_run:
        description: "If true, stage and inspect only — do NOT push the orphan branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialize per target (branch / release tag / input minor) so a slower
# older run can't force-push a stale `docs-archive/<minor>` over a newer
# one; distinct targets still run in parallel. (The release key is the full
# tag since GitHub expressions can't split `v26.5.0` into `26.5` — fine, a
# same-minor push/release overlap is rare and near-identical.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || github.event_name == 'release' && github.event.release.tag_name || inputs.minor_label }}
  cancel-in-progress: true

jobs:
  build-and-archive:
    # Skip pre-releases (rc/alpha/beta) on the `release` trigger; push and
    # dispatch always run.
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Git LFS: the archive keeps each image blob exactly as the source ref stores
    # it, a pointer or raw bytes, and never downloads or re-cleans anything:
    #   - checkout skips the smudge of the runner's preinstalled git-lfs (no
    #     downloads); the staged src/ copy is for the dry-run listing only;
    #   - the archive commit reuses the source tree's blobs (`read-tree`) and
    #     hashes the two added files with `--no-filters`, so no clean filter runs;
    #   - when the source tree holds pointers, the archive root gets a
    #     `.gitattributes` marking exactly those paths `filter=lfs`, so the
    #     Amplify worktree (pull-docs-images.sh, `git lfs pull`) can smudge them.
    #     A source with raw images gets no `.gitattributes`, as before;
    #   - the push skips git-lfs uploads: the objects are already on the server.
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Resolve archive parameters (push / release / manual dispatch)
        id: resolve
        # Map each trigger to (minor, source_ref): push → (branch, SHA),
        # release → (tag's MAJOR.MINOR, tag), dispatch → operator inputs.
        # Values pass via env vars (not inline interpolation) to avoid
        # command injection.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_MINOR_LABEL: ${{ inputs.minor_label }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            MINOR_LABEL="$PUSH_REF_NAME"
            SOURCE_REF="$PUSH_SHA"
            DRY_RUN="false"
          elif [ "$EVENT_NAME" = "release" ]; then
            # v26.5.0 / 26.5.0 -> 26.5 (the Validate step rejects anything
            # that isn't a clean MAJOR.MINOR).
            MINOR_LABEL="$(printf '%s' "$RELEASE_TAG" | sed -E 's/^v?([0-9]+\.[0-9]+)\..*$/\1/')"
            SOURCE_REF="$RELEASE_TAG"
            DRY_RUN="false"
          else
            MINOR_LABEL="$DISPATCH_MINOR_LABEL"
            SOURCE_REF="$DISPATCH_SOURCE_REF"
            DRY_RUN="${DISPATCH_DRY_RUN:-false}"
          fi
          {
            echo "minor_label=$MINOR_LABEL"
            echo "source_ref=$SOURCE_REF"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: event=$EVENT_NAME minor_label=$MINOR_LABEL source_ref=$SOURCE_REF dry_run=$DRY_RUN"

      - name: Validate minor label shape
        # Refuse anything that looks like a full patch (three numeric segments)
        # to mirror the validation in `versions.ts` — the selector lists minors
        # only, never patches. Inputs flow through env vars (NOT shell
        # interpolation) to avoid command injection from malicious input.
        env:
          MINOR_LABEL: ${{ steps.resolve.outputs.minor_label }}
        run: |
          if [[ "$MINOR_LABEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: minor_label '$MINOR_LABEL' looks like a patch."
            echo "Expected format: '<MAJOR>.<MINOR>' (e.g. 26.4). The selector lists minors only."
            exit 1
          fi
          if [[ ! "$MINOR_LABEL" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: minor_label '$MINOR_LABEL' is not a clean MAJOR.MINOR pair."
            exit 1
          fi

      - name: Checkout source ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.source_ref }}
          fetch-depth: 0

      - name: Verify docs source exists at source ref
        run: |
          SRC="packages/backend.ai-webui-docs/src"
          if [ ! -d "$SRC" ]; then
            echo "ERROR: expected docs source at $SRC (does this ref predate the package?)"
            exit 1
          fi
          if [ ! -f "$SRC/book.config.yaml" ]; then
            echo "ERROR: expected $SRC/book.config.yaml — required by docs-toolkit at consumer-rebuild time"
            exit 1
          fi
          echo "Docs source contents (top level):"
          ls -la "$SRC"

      - name: Stage archive contents (source markdown)
        # Archive root layout (matches what docs-toolkit expects when
        # resolving a `versions[].source.kind=archive-branch` entry):
        #   src/book.config.yaml
        #   src/<lang>/...                   # md + images
        #   .archive-info.txt
        #   .gitattributes                   # only when src/ holds LFS pointers
        # The commit step takes src/ from the source tree itself; from this
        # staging dir it uses only .archive-info.txt and .gitattributes.
        # Inputs flow through env vars to avoid shell injection.
        env:
          MINOR_LABEL: ${{ steps.resolve.outputs.minor_label }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p /tmp/docs-archive/src
          cp -R packages/backend.ai-webui-docs/src/. /tmp/docs-archive/src/
          # Drop a sentinel file so anyone browsing the branch knows
          # which minor + source ref produced it.
          cat > /tmp/docs-archive/.archive-info.txt <<EOF
          minor_label: $MINOR_LABEL
          source_ref:  $SOURCE_REF
          built_at:    $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          built_by:    docs-archive-orphan-branch.yml (gh actions run $RUN_ID)
          EOF
          # LFS pointers are read from the source commit's blobs, never from
          # the working tree. Pointer files are at most 1024 bytes.
          SRC="packages/backend.ai-webui-docs/src"
          : > /tmp/docs-archive-pointers
          while IFS= read -r -d '' entry; do
            meta="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            read -r _mode type oid size <<< "$meta"
            [ "$type" = blob ] && [ "$size" -le 1024 ] || continue
            first="$(git cat-file blob "$oid" | head -n1)"
            if [ "$first" = "version https://git-lfs.github.com/spec/v1" ]; then
              printf '%s\n' "src/${path#"$SRC"/}" >> /tmp/docs-archive-pointers
            fi
          done < <(git ls-tree -r -l -z HEAD -- "$SRC")
          if [ -s /tmp/docs-archive-pointers ]; then
            # Glob chars escaped; a path with whitespace as a C-quoted pattern.
            {
              echo "# Generated by docs-archive-orphan-branch.yml: Git LFS pointers of $SOURCE_REF."
              sed -e 's/[][*?\\]/\\&/g' -e '/[[:space:]]/{ s/[\\"]/\\&/g; s/.*/"&"/; }' \
                -e 's/$/ filter=lfs diff=lfs merge=lfs -text/' /tmp/docs-archive-pointers
            } > /tmp/docs-archive/.gitattributes
            echo "Source stores $(wc -l < /tmp/docs-archive-pointers) LFS pointer file(s); the archive gets a .gitattributes."
          else
            echo "No LFS pointers in the source tree; the archive gets no .gitattributes."
          fi
          echo "Staged archive contents:"
          ls -la /tmp/docs-archive
          echo "Source tree (top level):"
          ls -la /tmp/docs-archive/src

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create orphan branch and commit artifacts
        if: ${{ steps.resolve.outputs.dry_run != 'true' }}
        env:
          MINOR_LABEL: ${{ steps.resolve.outputs.minor_label }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          BRANCH="docs-archive/$MINOR_LABEL"
          # Build the parentless commit in a scratch index: `src/` is the
          # source commit's docs tree, blob for blob (pointers stay pointers,
          # raw images stay raw), plus the staged sentinel and .gitattributes.
          export GIT_INDEX_FILE="${RUNNER_TEMP:-/tmp}/docs-archive.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --prefix=src/ "HEAD:packages/backend.ai-webui-docs/src"
          for f in .archive-info.txt .gitattributes; do
            [ -f "/tmp/docs-archive/$f" ] || continue
            blob="$(git hash-object -w --no-filters "/tmp/docs-archive/$f")"
            git update-index --add --cacheinfo "100644,$blob,$f"
          done
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -m "docs-archive($MINOR_LABEL): snapshot src from $SOURCE_REF")"
          echo "Archive commit $COMMIT (tree $TREE)"
          # Force-push: each invocation replaces the previous archive for
          # this minor, since a higher patch on the same minor may carry
          # docs corrections that should land in the archive.
          # The LFS objects already live on the server and were never downloaded
          # here; a git-lfs pre-push hook would reject them as missing locally.
          GIT_LFS_SKIP_PUSH=1 git push --force origin "$COMMIT:refs/heads/$BRANCH"

      # The live site renders every archive at Amplify build time, but
      # Amplify only builds on pushes to `main`. Without this step, a
      # docs-only push to a release branch refreshes the archive branch
      # yet the deployed /<minor>/ pages stay stale until an unrelated
      # `main` merge happens to land (FR-3275). POSTing the Amplify
      # incoming webhook starts a rebuild of the main-HEAD pipeline so
      # the refreshed archive is re-rendered immediately. The release
      # path already rebuilds via the auto-opened pdfTag PR merge
      # (FR-3246); this covers the push/dispatch paths. Skips with a
      # warning when the secret is not configured, preserving the
      # previous behavior.
      - name: Trigger Amplify docs rebuild
        if: ${{ steps.resolve.outputs.dry_run != 'true' }}
        env:
          WEBHOOK: ${{ secrets.AMPLIFY_DOCS_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::AMPLIFY_DOCS_WEBHOOK_URL secret not set — docs-archive branch was updated, but the live site stays stale until the next main build. Create an Amplify incoming webhook (docs app → Build settings → Incoming webhooks) and store its URL in this secret."
            exit 0
          fi
          # The archive force-push above already succeeded, so a flaky
          # webhook must not fail the workflow. Bound the request (timeout
          # + retries) and downgrade any failure to a warning — the live
          # site will still refresh on the next main build.
          if curl -fsS --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
               -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d '{}'; then
            echo "Amplify rebuild triggered."
          else
            echo "::warning::Amplify webhook POST failed after retries — the docs-archive branch is already updated, so the live site will refresh on the next main build. Re-run this workflow (or POST the webhook manually) to force it sooner."
          fi

      - name: Dry-run summary
        if: ${{ steps.resolve.outputs.dry_run == 'true' }}
        env:
          MINOR_LABEL: ${{ steps.resolve.outputs.minor_label }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          echo "Dry-run mode: orphan branch was NOT pushed."
          echo "Would push: docs-archive/$MINOR_LABEL"
          echo "Source ref: $SOURCE_REF"
          echo "Artifact size:"
          du -sh /tmp/docs-archive
