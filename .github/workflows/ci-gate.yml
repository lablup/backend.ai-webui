# The single required status check on `main`. Most workflows here use
# `paths:` filters, and a required check that never starts blocks a PR as
# "Expected — Waiting", so instead this job runs on every PR, waits for
# whatever else was triggered on the head commit, and fails if any of it failed.
name: CI gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  statuses: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait for the other checks on the head commit
        run: |
          set -euo pipefail
          # Workflows triggered by the same push register a moment after this one.
          sleep 30
          deadline=$(( $(date +%s) + 70 * 60 ))
          while :; do
            runs_open=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $SELF_RUN_ID and .status != \"completed\")] | length" \
              | awk '{s+=$1} END {print s+0}')
            checks_open=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.name != "ci-gate" and .status != "completed")] | length' \
              | awk '{s+=$1} END {print s+0}')
            statuses=$(gh api "repos/$REPO/commits/$SHA/status" --jq '"\(.total_count) \(.state)"')
            statuses_open=0
            if [ "${statuses% *}" != 0 ] && [ "${statuses#* }" = pending ]; then statuses_open=1; fi
            echo "open: workflow runs=$runs_open check runs=$checks_open statuses pending=$statuses_open"
            if [ "$runs_open" -eq 0 ] && [ "$checks_open" -eq 0 ] && [ "$statuses_open" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=ci-gate::other checks did not finish within 70 minutes"
              exit 1
            fi
            sleep 30
          done

      - name: Fail if any of them failed
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[]
              | select(.name != "ci-gate")
              | select(.conclusion as $c | ["failure","cancelled","timed_out","action_required","startup_failure"] | index($c))
              | "\(.name): \(.conclusion)"')
          failed_statuses=$(gh api "repos/$REPO/commits/$SHA/status" \
            --jq '.statuses[] | select(.state == "failure" or .state == "error") | "\(.context): \(.state)"')
          if [ -n "$failed$failed_statuses" ]; then
            printf '%s\n' "$failed" "$failed_statuses" | sed '/^$/d' | while read -r line; do
              echo "::error title=ci-gate::$line"
            done
            exit 1
          fi
          echo "every other check on $SHA passed or was skipped"
