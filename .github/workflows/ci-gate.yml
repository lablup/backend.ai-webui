# The single required status check on `main`. Most workflows here use
# `paths:` filters, and a required check that never starts blocks a PR as
# "Expected — Waiting", so instead this job runs on every PR, waits for the
# `pull_request` workflows triggered on the head commit, and fails if any failed.
name: CI gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  statuses: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for the pull_request workflows on the head commit
        run: |
          set -uo pipefail
          SELF=.github/workflows/ci-gate.yml
          # A transient API error retries instead of failing the required check.
          api() {
            local attempt
            for attempt in 1 2 3; do
              gh api "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # Latest run per workflow file: a run superseded on the same commit
          # (cancelled by a newer one) does not count.
          latest_runs() {
            api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq '.workflow_runs[]' \
              | jq -s --arg self "$SELF" '
                  [.[] | select((.path | split("@")[0]) != $self)]
                  | group_by(.path) | map(max_by(.created_at))'
          }
          # Workflows triggered by the same push register a moment after this one.
          sleep 30
          deadline=$(( $(date +%s) + 70 * 60 ))
          previous=
          while :; do
            if runs=$(latest_runs) && status=$(api "repos/$REPO/commits/$SHA/status"); then
              open=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
              status_open=$(jq 'if .total_count > 0 and .state == "pending" then 1 else 0 end' <<<"$status")
              snapshot=$(jq -c '[.[] | [.id, .status]] | sort' <<<"$runs")
              echo "open: workflow runs=$open commit statuses pending=$status_open"
              # Settled = nothing open in two polls in a row over the same runs, so a
              # workflow that registers late is still waited for.
              if [ "$open" -eq 0 ] && [ "$status_open" -eq 0 ] && [ "$snapshot" = "$previous" ]; then
                # Judge from the same snapshot that showed nothing open.
                failed=$(jq -r '.[]
                  | select(.conclusion as $c | ["success","skipped","neutral"] | index($c) | not)
                  | "\(.name): \(.conclusion)"' <<<"$runs")
                if jq -e '.total_count > 0 and (.state == "failure" or .state == "error")' <<<"$status" >/dev/null; then
                  contexts=$(jq -r '.statuses[] | select(.state == "failure" or .state == "error") | "\(.context): \(.state)"' <<<"$status")
                  failed+=$'\n'"${contexts:-commit status: $(jq -r .state <<<"$status")}"
                fi
                if [ -n "${failed//$'\n'/}" ]; then
                  while IFS= read -r line; do
                    [ -n "$line" ] || continue
                    line=${line//%/%25}; line=${line//$'\r'/%0D}
                    echo "::error title=ci-gate::$line"
                  done <<<"$failed"
                  exit 1
                fi
                echo "every pull_request workflow on $SHA passed or was skipped"
                exit 0
              fi
              previous=$snapshot
            else
              echo "::warning title=ci-gate::GitHub API unavailable, retrying"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=ci-gate::other workflows did not finish within 70 minutes"
              exit 1
            fi
            sleep 45
          done
