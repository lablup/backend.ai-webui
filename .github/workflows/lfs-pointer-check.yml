# Files marked `filter=lfs` in .gitattributes must be committed as Git LFS
# pointers. A contributor without git-lfs commits the raw bytes instead, which
# nothing else notices. A no-op while nothing is LFS-tracked (#11040).
name: lfs-pointer-check

on:
  pull_request:
    paths:
      - "**/.gitattributes"
      - ".lfsconfig"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - ".github/scripts/lfs/**"
      - ".github/workflows/lfs-pointer-check.yml"

permissions:
  contents: read

concurrency:
  group: lfs-pointer-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lfs-pointer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only blobs are read, never LFS content.
      - uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Check that LFS-tracked files are committed as pointers
        run: bash .github/scripts/lfs/check-lfs-pointers.sh
