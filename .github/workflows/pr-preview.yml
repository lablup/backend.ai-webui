# Build the per-PR previews — Storybook, and the docs site with its changes
# marked — publish them to gh-pages, and post the PR Analysis Report.
#
# The event-level `paths` filter is the UNION of what the two build jobs care
# about, so each of them re-asks the question against the PR's own diff in the
# `changes` job below and skips when the answer is no.
#
# WHY THE DEPLOY LIVES HERE (FR-3899). It used to live in a second workflow
# triggered by `workflow_run`, so that the writing half ran main's code with
# main's token while this half stayed read-only. That split broke the Copilot
# case: a push by Copilot coding agent holds every run it causes for approval,
# a maintainer approves THIS run from the PR page, and the `workflow_run` run
# that follows is held again — invisibly, because such runs are attached to
# main and never listed on the PR. Nobody approved it and the preview stayed at
# the previous push. Approval is per run, and GitHub offers no way to exempt one
# workflow, so the only way one approval can cover the deploy is for the deploy
# to be part of the approved run.
#
# SECURITY, the trade-off that buys it. `publish` below is the one job with a
# write token, and it runs from the PR's own copy of this file and of
# `.github/scripts/pr-preview`. Approving a Copilot run is therefore a review of
# the whole diff, not just a click to start the build. Keep that job free of
# anything that executes PR-authored source: it downloads the artifacts the
# build jobs produced and copies them as static files. Do not add a build step,
# a `pnpm install`, or any `run:` that invokes package scripts to it.
#
# Fork PRs get a read-only token no matter what this file declares, so `publish`
# skips them and a fork PR gets no preview.

name: PR Preview

on:
  pull_request:
    paths:
      - packages/backend.ai-ui/**
      - packages/backend.ai-webui-docs/**
      - packages/backend.ai-docs-toolkit/**
      - .github/workflows/pr-preview.yml
      - .github/scripts/pr-preview/**

permissions:
  contents: read

concurrency:
  # Keyed by PR number, not branch name: branch names are unique only within a
  # repository, so two fork PRs both using e.g. `patch-1` would share a group and
  # cancel each other's runs.
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.detect.outputs.storybook }}
      docs: ${{ steps.detect.outputs.docs }}
      docs_langs: ${{ steps.detect.outputs.docs_langs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --depth=50 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Decide which previews this PR needs
        id: detect
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A merge base is what makes the three-dot diff report only what this
          # branch changed; deepen once before falling back to a two-dot diff.
          if ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            git fetch --deepen=200 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          fi

          if git diff --name-only "${BASE}...HEAD" 2>/dev/null \
            | grep -qE '^(packages/backend\.ai-ui/|\.github/workflows/pr-preview\.yml$|\.github/scripts/pr-preview/)'; then
            echo "storybook=true" >> "$GITHUB_OUTPUT"
          else
            echo "storybook=false" >> "$GITHUB_OUTPUT"
          fi

          DOCS_JSON="$(node .github/scripts/pr-preview/docs-changed-languages.mjs --base "$BASE" --head HEAD)"
          echo "Docs: ${DOCS_JSON}"
          echo "docs=$(jq -r '.docs' <<<"$DOCS_JSON")" >> "$GITHUB_OUTPUT"
          echo "docs_langs=$(jq -r '.languages | join(",")' <<<"$DOCS_JSON")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history for a three-dot diff against the base in the common
          # case; analyze-pr.mjs deepens on its own when the base has moved past
          # this window.
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --depth=50 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build Storybook
        working-directory: ./packages/backend.ai-ui
        run: pnpm run build-storybook

      - name: Compute the artifact suffix
        id: urls
        run: echo "short_hash=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Analyze changed components
        run: |
          node .github/scripts/pr-preview/analyze-pr.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --storybook-index packages/backend.ai-ui/storybook-static/index.json \
            --output analysis.json

      - name: Build and measure the package bundle (head)
        run: |
          pnpm --filter backend.ai-ui build
          node .github/scripts/pr-preview/measure-dist.mjs \
            --dist packages/backend.ai-ui/dist \
            --output bundle-head.json

      # Rebuild the same package from the base's sources to get a comparable
      # number. Only `src/` is swapped, so node_modules stays put — which is also
      # why the delta is abandoned outright when the PR touches anything else
      # that feeds the build. Swapping only `src/` under a changed vite config or
      # a changed dependency set would build the "base" with the HEAD's bundling,
      # and report a delta (often a reassuring zero) that describes no real
      # comparison. Runs LAST, and best-effort: a failure costs the delta column
      # and nothing else.
      - name: Build and measure the package bundle (base)
        id: bundle-base
        continue-on-error: true
        run: |
          BUILD_INPUTS=(
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            packages/backend.ai-ui/package.json
            packages/backend.ai-ui/vite.config.ts
            packages/backend.ai-ui/tsconfig.json
            relay.config.js
          )
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "${BUILD_INPUTS[@]}"; then
            echo "A build input outside src/ changed — skipping the base build (not comparable)."
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "${BUILD_INPUTS[@]}"
            exit 0
          fi
          rm -rf packages/backend.ai-ui/src
          git checkout "origin/${{ github.base_ref }}" -- packages/backend.ai-ui/src
          pnpm --filter backend.ai-ui build
          node .github/scripts/pr-preview/measure-dist.mjs \
            --dist packages/backend.ai-ui/dist \
            --output bundle-base.json

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-storybook-${{ steps.urls.outputs.short_hash }}
          path: packages/backend.ai-ui/storybook-static/
          if-no-files-found: error
          retention-days: 7

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-analysis
          path: |
            analysis.json
            bundle-head.json
            bundle-base.json
          if-no-files-found: error
          retention-days: 7

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          # The base build checks out the merge-base tree of `src/`, so the merge
          # base has to be inside this window (the build script falls back to the
          # base tip when it is not).
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --depth=50 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Compute the artifact suffix
        id: urls
        run: echo "short_hash=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build both docs trees and mark the changes
        run: |
          bash .github/scripts/pr-preview/build-docs-preview.sh \
            --base-ref "origin/${{ github.base_ref }}" \
            --languages "${{ needs.changes.outputs.docs_langs }}" \
            --out "${RUNNER_TEMP}/docs-preview" \
            --label "PR preview"

      # `docs-meta.json` is re-derived rather than passed through the job outputs
      # so the artifact carries the same JSON the detection script produced.
      - name: Collect the docs analysis
        run: |
          set -euo pipefail
          mkdir -p docs-analysis
          cp "${RUNNER_TEMP}/docs-preview/head/next/changes-manifest.json" \
            docs-analysis/docs-manifest.json
          node .github/scripts/pr-preview/docs-changed-languages.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --output docs-analysis/docs-meta.json

      - name: Upload docs preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-docs-${{ steps.urls.outputs.short_hash }}
          path: ${{ runner.temp }}/docs-preview/head/
          if-no-files-found: error
          retention-days: 7

      - name: Upload docs analysis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-docs-analysis
          path: docs-analysis/
          if-no-files-found: error
          retention-days: 7

  # ── the write half ─────────────────────────────────────────────────────────
  # `publish` and `report` hold the only write tokens in this workflow, one
  # scope each, and they are independent so a gh-pages failure still leaves a
  # report and vice versa. Read the SECURITY note in the header before adding a
  # step to either: neither may execute PR-authored source.
  #
  # Both take the same gate as the old `workflow_run` conclusion did — every
  # build job that ran must have succeeded, and at least one must have produced
  # something. Publishing off a failed build would let the surviving half's
  # `rm -rf pr/<n>` delete the other half's still-valid preview and rewrite the
  # report from half the data; skipping leaves the previous push's preview up.

  publish:
    needs: [build, docs]
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.docs.result == 'success' || needs.docs.result == 'skipped')
      && (needs.build.result == 'success' || needs.docs.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # gh-pages takes one push at a time across every PR; the retry loop below
      # then only has to cope with the cleanup job, not with sibling previews.
      group: pr-preview-gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out the maintenance scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/pr-preview

      - name: Compute the artifact suffix
        id: urls
        run: echo "short_hash=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-storybook-${{ steps.urls.outputs.short_hash }}
          path: storybook-dist
        # A preview this PR's diff never asked for is absent, not failed.
        continue-on-error: true

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-docs-${{ steps.urls.outputs.short_hash }}
          path: docs-dist
        continue-on-error: true

      - name: Verify the artifacts are usable
        id: verify
        run: |
          set -euo pipefail
          # A PR gets whichever previews its own diff called for, so one of the
          # two being absent is the normal case, not a failure.
          KINDS=()
          for kind in storybook docs; do
            if [ -d "${kind}-dist" ] && [ -n "$(ls -A "${kind}-dist" 2>/dev/null)" ]; then
              echo "${kind}=true" >> "$GITHUB_OUTPUT"
              KINDS+=("$kind")
            else
              echo "${kind}=false" >> "$GITHUB_OUTPUT"
            fi
          done

          if [ ${#KINDS[@]} -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither preview artifact is present — skipping the deploy for this run."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "kinds=$(printf '%s, ' "${KINDS[@]}" | sed 's/, $//')" >> "$GITHUB_OUTPUT"

      - name: Deploy to gh-pages
        if: steps.verify.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_STORYBOOK: ${{ steps.verify.outputs.storybook }}
          HAS_DOCS: ${{ steps.verify.outputs.docs }}
          KINDS: ${{ steps.verify.outputs.kinds }}
        run: |
          # A manual push with retry-on-conflict rather than a Pages action, so a
          # concurrent cleanup just retries instead of failing the run.
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          WORK_DIR="$PWD"
          PAGES_DIR="${RUNNER_TEMP}/gh-pages"
          MAX_ATTEMPTS=5

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt ${attempt} of ${MAX_ATTEMPTS}"
            cd "$WORK_DIR"
            rm -rf "$PAGES_DIR"

            if git clone --depth=1 --single-branch --branch gh-pages "$REPO_URL" "$PAGES_DIR" 2>/dev/null; then
              :
            else
              # First ever deploy: start the branch with no history to inherit.
              echo "No gh-pages branch — creating it."
              git init "$PAGES_DIR"
              git -C "$PAGES_DIR" checkout -b gh-pages
              git -C "$PAGES_DIR" remote add origin "$REPO_URL"
              # Tell Pages not to run the content through Jekyll, which would
              # drop Storybook's `_`-prefixed asset directories.
              touch "$PAGES_DIR/.nojekyll"
            fi

            # The PR's whole diff decides which previews it gets, so the set is
            # stable across pushes and replacing the directory drops nothing
            # that this run should have kept.
            rm -rf "${PAGES_DIR}/pr/${PR_NUMBER}"
            if [ "$HAS_STORYBOOK" = "true" ]; then
              mkdir -p "${PAGES_DIR}/pr/${PR_NUMBER}/storybook"
              cp -r storybook-dist/. "${PAGES_DIR}/pr/${PR_NUMBER}/storybook/"
            fi
            if [ "$HAS_DOCS" = "true" ]; then
              mkdir -p "${PAGES_DIR}/pr/${PR_NUMBER}/docs"
              cp -r docs-dist/. "${PAGES_DIR}/pr/${PR_NUMBER}/docs/"
            fi
            touch "${PAGES_DIR}/.nojekyll"
            node .github/scripts/pr-preview/write-index.mjs --root "$PAGES_DIR"

            cd "$PAGES_DIR"
            git add -A
            git commit -m "Deploy PR #${PR_NUMBER} preview (${KINDS})" \
              || { echo "Nothing to commit."; echo "::endgroup::"; exit 0; }

            if git push origin gh-pages; then
              echo "Deployed on attempt ${attempt}."
              echo "::endgroup::"
              exit 0
            fi

            echo "Push failed (likely a concurrent update); retrying in $((attempt * 2))s."
            echo "::endgroup::"
            sleep $((attempt * 2))
          done

          echo "::error::Failed to deploy the PR preview after ${MAX_ATTEMPTS} attempts."
          exit 1

  report:
    needs: [build, docs]
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.docs.result == 'success' || needs.docs.result == 'skipped')
      && (needs.build.result == 'success' || needs.docs.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # No setup-node — the report scripts use nothing beyond `node:fs` /
      # `node:child_process`, so the runner image's Node is enough and one fewer
      # step has to go right.
      - name: Check out the report scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/pr-preview

      - name: Download analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-analysis
          path: pr-analysis
        continue-on-error: true

      - name: Download docs analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-docs-analysis
          path: pr-docs-analysis
        continue-on-error: true

      - name: Post or update the PR Analysis Report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');

            // Either half is enough to be worth a report: a docs-only PR
            // produces no analysis.json, a Storybook-only PR no manifest.
            const hasAnalysis = fs.existsSync('pr-analysis/analysis.json');
            const hasDocs = fs.existsSync('pr-docs-analysis/docs-manifest.json');
            if (!hasAnalysis && !hasDocs) {
              core.info('No analysis artifacts — nothing to report.');
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            // Everything the report needs that is not a measurement is derived
            // here, from the event payload, not from an artifact.
            fs.writeFileSync('pr-meta.json', JSON.stringify({
              prNumber: String(prNumber),
              shortHash: headSha.slice(0, 7),
              storybookUrl: `https://${owner}.github.io/${repo}/pr/${prNumber}/storybook/`,
              docsUrl: `https://${owner}.github.io/${repo}/pr/${prNumber}/docs/next/`,
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            }));

            const args = [
              '.github/scripts/pr-preview/generate-pr-comment.mjs',
              '--meta', 'pr-meta.json',
            ];
            if (hasAnalysis) {
              args.push('--analysis', 'pr-analysis/analysis.json');
            }
            if (fs.existsSync('pr-analysis/bundle-head.json')) {
              args.push('--bundle-head', 'pr-analysis/bundle-head.json');
            }
            if (fs.existsSync('pr-analysis/bundle-base.json')) {
              args.push('--bundle-base', 'pr-analysis/bundle-base.json');
            }
            if (hasDocs) {
              args.push('--docs', 'pr-docs-analysis/docs-manifest.json');
            }
            if (fs.existsSync('pr-docs-analysis/docs-meta.json')) {
              args.push('--docs-meta', 'pr-docs-analysis/docs-meta.json');
            }

            const body = execFileSync('node', args, { encoding: 'utf8' });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('PR Analysis Report'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated the PR Analysis Report on #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info(`Posted the PR Analysis Report on #${prNumber}.`);
            }
