# Astryx migration gates — INFORMATIONAL ONLY.
#
# Reports the current antd residue while the antd → Astryx migration is in
# progress on `to-astryx`:
#   - antd-zero-gate.sh: (a) prod dependency graph, (b) build output
#     signatures (skipped, no build here), (c) source import-graph
#     reachability (P15 — a file is only antd-free when its whole import
#     graph is)
#   - .ant-* selector references (P6/P17 hidden DOM/CSS coupling)
#   - undeclared var() token usage (P19 silent-failure patterns)
#
# The `visual-harness` job that used to live here is gone (final switch). It
# drove `react/theme-probe/form.html?variant=antd|bai` through
# scripts/migration-gates/visual-compare.mjs to compare layout anatomy and
# token compliance between the two stacks. Its "before" side was antd, which is
# no longer installed, so the whole theme-probe harness was removed with it.
# `visual-compare.mjs` itself stays — it compares two arbitrary URLs and is the
# tool to reach for on any future before/after, migration or not.
#
# NON-BLOCKING by design: report.sh always exits 0. Do NOT add this job to a
# required-checks ruleset — it enumerates migration residue, not build health.
# The blocking form is `bash scripts/antd-zero-gate.sh` / each gate's
# `--strict`, which is what to flip on now that the migration is complete.
name: Astryx migration gates (informational)

on:
  push:
    branches: [to-astryx]
  pull_request:
    branches: [to-astryx]
    paths:
      - "react/**"
      - "packages/backend.ai-ui/**"
      - "e2e/**"
      - "scripts/migration-gates/**"
      - "scripts/antd-zero-gate.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/astryx-migration-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astryx-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: static gates (import graph / .ant-* / var tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      # Full install: part (a) of antd-zero-gate asks pnpm for the resolved
      # production graph, and the P19 gate reads @astryxdesign css from
      # react/node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migration gates (informational)
        run: bash scripts/migration-gates/report.sh
