# Astryx migration gates — INFORMATIONAL ONLY.
#
# Reports the current antd residue while the antd → Astryx migration is in
# progress on `to-astryx`:
#   - antd-zero-gate.sh: (a) prod dependency graph, (b) build output
#     signatures (skipped, no build here), (c) source import-graph
#     reachability (P15 — a file is only antd-free when its whole import
#     graph is)
#   - .ant-* selector references (P6/P17 hidden DOM/CSS coupling)
#   - undeclared var() token usage (P19 silent-failure patterns)
#   - visual comparison harness (layout anatomy + token compliance,
#     light/dark) on the theme-probe form page (antd baseline vs BAIFormItem)
#
# NON-BLOCKING by design: report.sh always exits 0 and the visual job is
# continue-on-error. Do NOT add these jobs to a required-checks ruleset —
# they enumerate remaining migration work, not build health. The blocking
# form is `bash scripts/antd-zero-gate.sh` / each gate's `--strict`, to be
# flipped on only at migration completion.
name: Astryx migration gates (informational)

on:
  push:
    branches: [to-astryx]
  pull_request:
    branches: [to-astryx]
    paths:
      - "react/**"
      - "packages/backend.ai-ui/**"
      - "e2e/**"
      - "scripts/migration-gates/**"
      - "scripts/antd-zero-gate.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/astryx-migration-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astryx-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: static gates (import graph / .ant-* / var tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      # Full install: part (a) of antd-zero-gate asks pnpm for the resolved
      # production graph, and the P19 gate reads @astryxdesign css from
      # react/node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migration gates (informational)
        run: bash scripts/migration-gates/report.sh

  visual-harness:
    name: visual harness (anatomy + token compliance)
    runs-on: ubuntu-latest
    # Never blocks: the comparison verdict is REVIEW material, not pass/fail.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start theme-probe server
        run: |
          nohup pnpm --prefix ./react exec vite --config theme-probe/vite.config.mts \
            > /tmp/theme-probe.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:9198/theme-probe/form.html; then
              echo "theme-probe server up"; exit 0
            fi
            sleep 1
          done
          echo "theme-probe server did not come up"; cat /tmp/theme-probe.log; exit 1
      - name: Capture before (antd baseline) / after (BAIFormItem)
        run: |
          node scripts/migration-gates/visual-compare.mjs capture \
            --url 'http://127.0.0.1:9198/theme-probe/form.html?variant=antd' \
            --mode-param mode --wait 'pre[data-result]' \
            --out /tmp/visual/before-antd
          node scripts/migration-gates/visual-compare.mjs capture \
            --url 'http://127.0.0.1:9198/theme-probe/form.html?variant=bai' \
            --mode-param mode --wait 'pre[data-result]' \
            --out /tmp/visual/after-bai
      - name: Compare (layout anatomy + token compliance)
        run: |
          node scripts/migration-gates/visual-compare.mjs compare \
            --before /tmp/visual/before-antd --after /tmp/visual/after-bai \
            --out /tmp/visual --ignore '^(div#(antd|bai)|h3:)'
          {
            echo "## Visual harness (informational)"
            echo ""
            cat /tmp/visual/report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: astryx-visual-comparison
          path: /tmp/visual/
          retention-days: 14
