# Keeps main's cache of the user manual's Git LFS objects current (#11070).
# PR previews restore it and download only the objects it lacks. GitHub scopes
# caches by ref: PR runs can read main's cache, but main runs cannot read a PR's,
# so this workflow is what writes the store new PRs start from. It downloads
# only the images changed since the last save; the scheduled runs restore the
# entry so that GitHub does not evict it after 7 days without use.
name: docs-lfs-cache

on:
  push:
    branches: [main]
    paths:
      - "packages/backend.ai-webui-docs/src/**/*.png"
      - "packages/backend.ai-webui-docs/src/**/*.jpg"
      - "packages/backend.ai-webui-docs/src/**/*.jpeg"
      - "packages/backend.ai-webui-docs/src/**/*.gif"
      - "packages/backend.ai-webui-docs/src/**/*.webp"
      - ".github/scripts/lfs/**"
      - ".github/workflows/docs-lfs-cache.yml"
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lfs-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lfs-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Compute the LFS cache key
        id: key
        run: |
          key="$(bash .github/scripts/lfs/docs-lfs-cache-key.sh)"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Look up the cache
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # A scheduled run restores even an exact hit: that is what keeps it in use.
      - name: Restore the LFS object cache
        if: steps.lookup.outputs.cache-hit != 'true' || github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.key.outputs.key }}
          restore-keys: docs-lfs-v1-

      - name: Pull the manual images (Git LFS)
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          LFS_USED_OIDS_FILE: ${{ runner.temp }}/lfs-used-oids
        run: bash .github/scripts/lfs/pull-docs-images.sh

      - name: Prune the LFS object store to what main uses
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bash .github/scripts/lfs/prune-lfs-store.sh "${RUNNER_TEMP}/lfs-used-oids"

      - name: Save the LFS object cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.key.outputs.key }}
