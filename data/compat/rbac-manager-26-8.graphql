# Manager < 26.9.0 RBAC schema, kept so the compatibility-gated documents
# compile (FR-3905). Every definition here is copied from the 26.8.3
# supergraph; 26.9.0 removed them. Documents select these fields under
# `@deprecatedSince(version: "26.9.0")` and their 26.9 counterparts under
# `@since(version: "26.9.0")`, and the request transformer strips whichever
# side the connected manager does not know.
#
# Delete this file, and its entry in relay-base.config.js, when 26.8 support
# ends. Never add a 26.9 field here: data/schema.graphql is the supergraph.


enum RBACElementType {
  DOMAIN
  PROJECT
  USER
  SESSION
  VFOLDER
  MODEL_DEPLOYMENT
  KEYPAIR
  NOTIFICATION_CHANNEL
  NETWORK
  IDLE_CHECKER_ASSIGNMENT
  RESOURCE_GROUP
  CONTAINER_REGISTRY
  STORAGE_HOST
  AGENT
  KERNEL
  ROUTING
  IMAGE
  ARTIFACT
  ARTIFACT_REGISTRY
  SESSION_TEMPLATE
  APP_CONFIG
  APP_CONFIG_DEFINITION
  APP_CONFIG_ALLOW_LIST
  APP_CONFIG_FRAGMENT
  MODEL_CARD
  RESOURCE_PRESET
  USER_RESOURCE_POLICY
  KEYPAIR_RESOURCE_POLICY
  PROJECT_RESOURCE_POLICY
  ROLE
  AUDIT_LOG
  KERNEL_HISTORY
  EVENT_LOG
  PROJECT_ADMIN_PAGE
  DOMAIN_ADMIN_PAGE
  NOTIFICATION_RULE
  DEPLOYMENT_TOKEN
  DEPLOYMENT_POLICY
  DEPLOYMENT_REVISION
  IMAGE_ALIAS
  ROLE_ASSIGNMENT
  VFOLDER_DATA
  SESSION_APP_SERVICE
  USER_EMAIL
  ARTIFACT_REVISION
}

input RBACElementTypeFilter {
  """Matches rows with this exact element type."""
  equals: RBACElementType = null

  """Matches rows whose element type is in this list."""
  in: [RBACElementType!] = null

  """Excludes rows with this exact element type."""
  notEquals: RBACElementType = null

  """Excludes rows whose element type is in this list."""
  notIn: [RBACElementType!] = null
}

enum OperationType {
  CREATE
  READ
  UPDATE
  SOFT_DELETE
  HARD_DELETE
  GRANT_ALL
  GRANT_READ
  GRANT_UPDATE
  GRANT_SOFT_DELETE
  GRANT_HARD_DELETE
}

input OperationTypeFilter {
  """Matches rows with this exact operation."""
  equals: OperationType = null

  """Matches rows whose operation is in this list."""
  in: [OperationType!] = null

  """Excludes rows with this exact operation."""
  notEquals: OperationType = null

  """Excludes rows whose operation is in this list."""
  notIn: [OperationType!] = null
}

enum EntityOrderField {
  ENTITY_TYPE
  REGISTERED_AT
}

input EntityOrderBy {
  field: EntityOrderField!
  direction: OrderDirection! = DESC
}

input EntityFilter {
  entityType: RBACElementTypeFilter = null
  entityId: StringFilter = null

  """
  Added in 26.8.0. Filter by the type of scope the entity is registered in.
  """
  scopeType: RBACElementTypeFilter = null

  """
  Added in 26.8.0. Filter by the id of scope the entity is registered in.
  """
  scopeId: StringFilter = null
  AND: [EntityFilter!] = null
  OR: [EntityFilter!] = null
  NOT: [EntityFilter!] = null
}

type EntityRef implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  scopeType: RBACElementType!
  scopeId: String!
  entityType: RBACElementType!
  entityId: String!
  registeredAt: DateTime!

  """The resolved entity object."""
  entity: EntityNode

  """
  Added in 26.4.3. The resolved scope object in which the entity is registered.
  """
  scope: EntityNode
}

type EntityRefEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: EntityRef!
}

type EntityConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [EntityRefEdge!]!
  count: Int!
}

extend type Role {
  """Added in 26.4.2. Scopes this role is registered in."""
  scopes(filter: EntityFilter = null, orderBy: [EntityOrderBy!] = null, before: String = null, after: String = null, first: Int = null, last: Int = null, limit: Int = null, offset: Int = null): EntityConnection
}

extend type Permission {
  scopeType: RBACElementType!
  scopeId: String!
  operation: OperationType!
  """The scope this permission applies to."""
  scope: EntityNode
}

extend input PermissionFilter {
  scopeType: RBACElementTypeFilter = null
  scopeId: StringFilter = null
}

extend input PermissionNestedFilter {
  scopeId: StringFilter = null
  scopeType: RBACElementTypeFilter = null
  operation: OperationTypeFilter = null
}

extend input CreatePermissionInput {
  scopeType: RBACElementType!
  scopeId: String!
  operation: OperationType!
}

extend input UpdatePermissionInput {
  scopeType: RBACElementType = null
  scopeId: String = null
  operation: OperationType = null
}

extend type BulkAddRolePermissionFailureInfo {
  """Scope element type of the failed entry."""
  scopeType: String!
  """Scope element ID of the failed entry."""
  scopeId: String!
  """Operation type of the failed entry."""
  operation: String!
}

extend type ReplaceRolePermissionFailureInfo {
  """Scope element type of the failed entry."""
  scopeType: String!
  """Scope element ID of the failed entry."""
  scopeId: String!
  """Operation type of the failed entry."""
  operation: String!
}

extend type BulkAddRolePermissionPresetFailureInfo {
  """Operation of the permission entry that failed."""
  operation: OperationType!
}

extend type RolePermissionPreset {
  """Operation granted by the permission."""
  operation: OperationType!
}

extend input RolePermissionPresetEntryInput {
  """Operation granted by the permission."""
  operation: OperationType!
}

extend input RolePermissionPresetFilter {
  """Filter by granted operation."""
  operation: OperationTypeFilter = null
}
