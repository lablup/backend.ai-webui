<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="adr-ref" content="fix/gh-11437-theme-family-stale-after-relogin" />
    <title>Architecture Decision Records · Backend.AI WebUI</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.3.0/index.css"
    />
    <script>
      (() => {
        let t = null;
        try {
          t = localStorage.getItem("adr-viewer:theme");
        } catch {}
        const dark = t
          ? t === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      :root {
        --font-sans:
          "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        --font-mono:
          "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo,
          "Pretendard Variable", monospace;
        --header-h: 56px;
        --sidebar-w: 288px;
        --toc-w: 232px;
        --radius: 10px;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --bg-soft: #fafafa;
        --surface: #f6f6f7;
        --surface-2: #fbfbfc;
        --border: #e8e8eb;
        --border-strong: #d6d6db;
        --text: #18181b;
        --text-2: #3f3f46;
        --muted: #71717a;
        --faint: #a1a1aa;
        --accent: #e8590c;
        --accent-text: #c2410c;
        --accent-soft: #fff4eb;
        --accent-line: #fdcfae;
        --hit: #fde68a;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --danger-line: #fecaca;
        --add: #1a7f37;
        --add-soft: #edfbf1;
        --add-line: #a6e3b8;
        --mod: #9a6700;
        --mod-soft: #fff8e1;
        --mod-line: #f2d68c;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
        --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.12);
        --hl-keyword: #cf222e;
        --hl-string: #0a3069;
        --hl-number: #0550ae;
        --hl-comment: #6e7781;
        --hl-title: #8250df;
        --hl-type: #953800;
        --mmd-node: #ffffff;
        --mmd-node-border: #cfcfd6;
        --mmd-accent: #fff4eb;
        --mmd-accent-border: #f6b98a;
        --mmd-tertiary: #f6f6f7;
        --mmd-tertiary-border: #e1e1e6;
        --mmd-line: #8b8b95;
        --mmd-text: #27272a;
        --mmd-cluster: #f4f4f6;
        --mmd-cluster-border: #dcdce2;
        --mmd-note-text: #7c2d12;
        --mmd-actor-border: #c4c4cc;
        --mmd-signal: #52525b;
        --mmd-activation: #f1f1f4;
        --mmd-activation-border: #b4b4bc;
      }
      [data-theme="dark"] {
        --bg: #0c0c0e;
        --bg-soft: #0f0f12;
        --surface: #16161a;
        --surface-2: #121215;
        --border: #232328;
        --border-strong: #34343b;
        --text: #ececef;
        --text-2: #c9c9d0;
        --muted: #9a9aa4;
        --faint: #62626b;
        --accent: #ff8a3d;
        --accent-text: #ff9f5e;
        --accent-soft: #24170e;
        --accent-line: #5a3216;
        --hit: #6b4f0f;
        --danger: #f87171;
        --danger-soft: #1f1213;
        --danger-line: #4c1d1d;
        --add: #4ade80;
        --add-soft: #0e1f14;
        --add-line: #1f4d2e;
        --mod: #fbbf24;
        --mod-soft: #1f1a0b;
        --mod-line: #4d3d12;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.25);
        --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.6);
        --hl-keyword: #ff7b72;
        --hl-string: #a5d6ff;
        --hl-number: #79c0ff;
        --hl-comment: #8b949e;
        --hl-title: #d2a8ff;
        --hl-type: #ffa657;
        --mmd-node: #1d1d23;
        --mmd-node-border: #3f3f48;
        --mmd-accent: #2a1a0e;
        --mmd-accent-border: #7a3d14;
        --mmd-tertiary: #16161b;
        --mmd-tertiary-border: #34343b;
        --mmd-line: #8a8a94;
        --mmd-text: #d4d4da;
        --mmd-cluster: #141418;
        --mmd-cluster-border: #34343b;
        --mmd-note-text: #f5d0b0;
        --mmd-actor-border: #4a4a54;
        --mmd-signal: #b4b4bc;
        --mmd-activation: #2a2a31;
        --mmd-activation-border: #5a5a64;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings:
          "ss05",
          "tnum" 0;
        scroll-padding-top: calc(var(--header-h) + 24px);
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      ::selection {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        height: var(--header-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 20px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: saturate(1.6) blur(14px);
        -webkit-backdrop-filter: saturate(1.6) blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 650;
        font-size: 15px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #ff9a4d, #e8590c 60%, #c2410c);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.25),
          0 1px 2px rgb(194 65 12 / 0.4);
        color: #fff;
      }
      .brand-mark svg {
        width: 15px;
        height: 15px;
        stroke: #fff;
        stroke-width: 2.2;
      }
      .brand-sep {
        color: var(--faint);
        font-weight: 400;
      }
      .brand-sub {
        color: var(--muted);
        font-weight: 500;
      }
      .ref-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 6px 0 9px;
        border-radius: 999px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-text);
        font: 500 12px/1 var(--font-mono);
        text-decoration: none;
        max-width: 280px;
      }
      .ref-pill[hidden] {
        display: none;
      }
      .ref-pill span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ref-pill .x {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        opacity: 0.7;
      }
      .ref-pill:hover .x {
        opacity: 1;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .seg button,
      .seg a {
        border: 0;
        background: none;
        height: 24px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .seg button[aria-pressed="true"],
      .seg a[aria-current="page"] {
        background: var(--bg);
        color: var(--text);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.08),
          0 0 0 1px var(--border);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        text-decoration: none;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--surface);
      }
      .icon-btn svg.i {
        width: 18px;
        height: 18px;
      }
      .menu-btn {
        display: none;
        margin-left: -8px;
      }
      [data-theme="light"] .theme-btn .moon,
      [data-theme="dark"] .theme-btn .sun {
        display: none;
      }

      .shell {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
        min-height: calc(100vh - var(--header-h));
      }
      .shell.landing {
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 0;
      }
      .sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100vh - var(--header-h));
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--bg-soft);
        z-index: 30;
      }
      .search {
        position: relative;
        margin: 16px 14px 8px;
      }
      .search svg.i {
        position: absolute;
        left: 11px;
        top: 50%;
        translate: 0 -50%;
        color: var(--faint);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        height: 36px;
        padding: 0 36px 0 34px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search input::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      .search input::placeholder {
        color: var(--faint);
      }
      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .search kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        translate: 0 -50%;
        font: 500 11px/1 var(--font-mono);
        color: var(--faint);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3px 6px;
        background: var(--surface-2);
      }
      .search input:focus + kbd,
      .search input:not(:placeholder-shown) + kbd {
        display: none;
      }
      .search-status {
        margin: 0 16px 4px;
        min-height: 18px;
        font-size: 12px;
        color: var(--faint);
      }
      .adr-nav {
        flex: 1;
        overflow-y: auto;
        padding: 0 10px 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
      .nav-label,
      .toc-title {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .nav-label {
        display: flex;
        justify-content: space-between;
        margin: 18px 10px 6px;
      }
      .nav-item {
        position: relative;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: baseline;
        gap: 2px 6px;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13.5px;
        line-height: 1.4;
        color: var(--text-2);
        transition:
          background 0.12s,
          color 0.12s;
      }
      .nav-item:hover {
        background: var(--surface);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 550;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }
      .nav-num {
        font: 500 11.5px/1.4 var(--font-mono);
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-item.active .nav-num {
        color: var(--accent-text);
        opacity: 0.75;
      }
      .nav-item.home {
        grid-template-columns: 38px 1fr;
      }
      .nav-item.home .nav-num {
        display: grid;
        place-items: start;
        padding-top: 2px;
      }
      .nav-count {
        font-size: 11px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-snip {
        grid-column: 2 / -1;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        font-weight: 400;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      mark {
        background: var(--hit);
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
      }
      mark.hit {
        padding: 0 2px;
      }
      .nav-empty {
        padding: 24px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--faint);
      }
      .scrim {
        display: none;
      }

      .main {
        min-width: 0;
        padding: 48px 56px 96px;
      }
      .doc {
        max-width: 46rem;
        margin: 0 auto;
        font-size: 16px;
        line-height: 1.72;
        color: var(--text-2);
        animation: fade-in 0.35s var(--ease);
      }
      .landing .doc {
        max-width: 60rem;
      }
      .doc:lang(ko) {
        word-break: keep-all;
        overflow-wrap: break-word;
        line-height: 1.78;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          translate: 0 6px;
        }
      }
      .doc-head {
        margin-bottom: 36px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--border);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--muted);
        background: var(--surface-2);
        text-decoration: none;
        white-space: nowrap;
      }
      .chip.num {
        font-family: var(--font-mono);
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-line);
        letter-spacing: 0.02em;
      }
      a.chip:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .doc h1 {
        margin: 0;
        font-size: clamp(1.85rem, 1.4rem + 1.6vw, 2.45rem);
        line-height: 1.18;
        font-weight: 720;
        letter-spacing: -0.028em;
        color: var(--text);
        text-wrap: balance;
      }
      .doc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 18px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .doc-meta a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .doc-meta a:hover {
        color: var(--accent-text);
      }
      .doc-meta svg.i {
        width: 14px;
        height: 14px;
      }
      .doc h2,
      .doc h3,
      .doc h4 {
        position: relative;
        color: var(--text);
        letter-spacing: -0.018em;
        text-wrap: balance;
      }
      .doc h2 {
        margin: 3.1em 0 0.8em;
        font-size: 1.5rem;
        line-height: 1.3;
        font-weight: 680;
      }
      .doc .prose > h2:first-child {
        margin-top: 0;
      }
      .doc h3 {
        margin: 2.2em 0 0.6em;
        font-size: 1.17rem;
        line-height: 1.4;
        font-weight: 650;
      }
      .doc h4 {
        margin: 1.8em 0 0.5em;
        font-size: 1rem;
        font-weight: 650;
      }
      .h-anchor {
        position: absolute;
        left: -1.1em;
        padding-right: 0.3em;
        color: var(--faint);
        text-decoration: none;
        font-weight: 400;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .doc h2:hover .h-anchor,
      .doc h3:hover .h-anchor,
      .doc h4:hover .h-anchor {
        opacity: 1;
      }
      .h-anchor:hover {
        color: var(--accent);
      }
      .doc p {
        margin: 0 0 1.1em;
      }
      .doc strong {
        color: var(--text);
        font-weight: 650;
      }
      .doc .prose a,
      .doc .lead a {
        color: var(--accent-text);
        text-decoration: underline;
        text-decoration-color: color-mix(
          in srgb,
          var(--accent) 35%,
          transparent
        );
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
        transition: text-decoration-color 0.15s;
      }
      .doc .prose a.card {
        color: inherit;
        text-decoration: none;
      }
      .doc .prose a:hover {
        text-decoration-color: currentColor;
      }
      .doc a.ext::after {
        content: "↗";
        font-size: 0.75em;
        margin-left: 0.15em;
        vertical-align: 0.15em;
        opacity: 0.7;
      }
      .doc ul,
      .doc ol {
        margin: 0 0 1.2em;
        padding-left: 1.4em;
      }
      .doc li {
        margin: 0.4em 0;
        padding-left: 0.2em;
      }
      .doc li > ul,
      .doc li > ol {
        margin: 0.4em 0;
      }
      .doc ul > li::marker {
        color: var(--faint);
      }
      .doc ol > li::marker {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.9em;
      }
      .doc hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 2.5em 0;
      }
      .doc code {
        font-family: var(--font-mono);
        font-size: 0.84em;
        font-variant-ligatures: none;
      }
      .doc :not(pre) > code {
        padding: 0.14em 0.4em;
        border-radius: 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        overflow-wrap: anywhere;
        word-break: normal;
      }
      .doc a > code {
        color: inherit;
      }
      .code {
        position: relative;
        margin: 1.4em 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        overflow: hidden;
      }
      .code[data-lang]::before {
        content: attr(data-lang);
        position: absolute;
        top: 9px;
        right: 12px;
        font: 600 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        transition: opacity 0.15s;
      }
      .code:hover::before {
        opacity: 0;
      }
      .code pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text);
        scrollbar-width: thin;
      }
      .code code {
        font-size: inherit;
      }
      .copy,
      .diagram .expand {
        position: absolute;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .code:hover .copy,
      .copy:focus-visible,
      .diagram.ok:hover .expand,
      .diagram .expand:focus-visible {
        opacity: 1;
      }
      .copy {
        top: 7px;
        right: 7px;
        gap: 5px;
        height: 26px;
        padding: 0 8px;
        border-radius: 6px;
      }
      .copy:hover {
        color: var(--text);
      }
      .copy svg.i {
        width: 13px;
        height: 13px;
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-meta .hljs-keyword {
        color: var(--hl-keyword);
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-template-string {
        color: var(--hl-string);

      .zoom {

    <script type="module">
      import {
        Marked,
        Parser,
        Renderer,
      } from "https://cdn.jsdelivr.net/npm/marked@18.2.1/lib/marked.esm.js";
      import GithubSlugger from "https://cdn.jsdelivr.net/npm/github-slugger@2.0.0/index.js";
      import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.4.18/dist/purify.es.mjs";

      const MERMAID_URL =
        "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs";
      const HLJS_URL =
        "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/";
      const HL = { ts: "typescript", typescript: "typescript", css: "css" };
      const REPO = "lablup/backend.ai-webui";

      const T = {
        en: {
          search: "Search decisions",
          overview: "Overview",
          decisions: "Decisions",
          onPage: "On this page",
          prev: "Previous",
          next: "Next",
          github: "View on GitHub",
          raw: "Raw markdown",
          top: "Back to top",
          amend: "Amendment",
          expand: "Expand",
          copy: "Copy",
          copied: "Copied",
          copyFail: "Copy failed",
          mmdErr: "Mermaid diagram failed to render",
          zoomHint: "Scroll to zoom · Drag to pan · Esc to close",
          loadingIdx: "Indexing full text…",
          results: (n) => `${n} match${n === 1 ? "" : "es"}`,
          none: "No decision matches this search.",
          notFound: "Decision not found",
          notFoundBody: "No ADR with this number is listed in the index.",
          fail: "Could not load",
          inForce: (n) => `<b>${n}</b>decisions in force`,
          languages: (n) => `<b>${n}</b>languages`,
          source: "Source",
          localCopy: "local copy",
          lang: "English",
          clearRef: "Back to the published copy",
          st: { added: "Added", modified: "Changed", removed: "Removed" },
          viewDoc: "Document",
          viewDiff: (b) => `Changes vs ${b}`,
          compare: "Compare on GitHub",
          noLangChange: "No changes in this language.",
          changed: (n, b) =>
            `This preview shows <b>${n}</b> ADR${n === 1 ? "" : "s"} changed against <code>${b}</code>.`,
          archChanged: (f) => `The index (<code>${f}</code>) changed too.`,
        },
        ko: {
          search: "ADR 검색",
          overview: "개요",
          decisions: "결정 목록",
          onPage: "목차",
          prev: "이전",
          next: "다음",
          github: "GitHub에서 보기",
          raw: "원본 마크다운",
          top: "맨 위로",
          amend: "개정",
          expand: "확대",
          copy: "복사",
          copied: "복사됨",
          copyFail: "복사 실패",
          mmdErr: "다이어그램을 표시하지 못했습니다",
          zoomHint: "스크롤해서 확대 · 끌어서 이동 · Esc로 닫기",
          loadingIdx: "본문 검색 준비 중…",
          results: (n) => `${n}건 찾음`,
          none: "검색 결과가 없습니다.",
          notFound: "ADR을 찾을 수 없습니다",
          notFoundBody: "목록에 없는 번호입니다.",
          fail: "불러오지 못했습니다",
          inForce: (n) => `결정된 ADR <b>${n}개</b>`,
          languages: (n) => `지원 언어 <b>${n}개</b>`,
          source: "출처",
          localCopy: "로컬 파일",
          lang: "한국어",
          clearRef: "배포본으로 돌아가기",
          st: { added: "추가", modified: "변경", removed: "삭제" },
          viewDoc: "문서",
          viewDiff: (b) => `${b} 대비 변경`,
          compare: "GitHub에서 비교",
          noLangChange: "이 언어의 문서는 바뀌지 않았습니다.",
          changed: (n, b) =>
            `이 미리보기는 <code>${b}</code> 대비 바뀐 ADR <b>${n}개</b>를 보여 줍니다.`,
          archChanged: (f) => `목록 문서(<code>${f}</code>)도 바뀌었습니다.`,
        },
      };

      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const icon = (d, cls = "i") =>
        `<svg class="${cls}" viewBox="0 0 24 24">${d}</svg>`;
      const ICON = {
        gh: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
        up: '<path d="m18 15-6-6-6 6"/>',
        copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
        expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
        warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
        info: '<path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/>',
        pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>',
        home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
        branch:
          '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 5.5"/>',
        x: '<path d="M6 6l12 12M18 6 6 18"/>',
      };

      const qRef = new URLSearchParams(location.search).get("ref");
      const ref =
        qRef &&
        /^[A-Za-z0-9._/-]+$/.test(qRef) &&
        !qRef.startsWith("/") &&
        !qRef.split("/").includes("..")
          ? qRef
          : null;
      const builtRef = document
        .querySelector('meta[name="adr-ref"]')
        .content.trim();
      const viewRef = ref || builtRef;
      const blobRef = viewRef || "main";
      const srcUrl = (p) =>
        ref
          ? `https://raw.githubusercontent.com/${REPO}/${encodeURI(ref)}/docs/${p}`
          : p;
      const blobUrl = (p, at = blobRef) =>
        `https://github.com/${REPO}/blob/${encodeURI(at)}/${p}`;

      const ADR_PATH = /^adr\/[A-Za-z0-9._-]+\.md$/;
      const FILE_ST = ["added", "modified", "removed", "renamed", "unchanged"];
      const str = (v) => (typeof v === "string" ? v : "");
      function readChanges(j) {
        if (!Array.isArray(j?.adrs)) return null;
        const adrs = new Map();
        for (const c of j.adrs) {
          if (!/^\d{4}$/.test(c?.id)) continue;
          if (!["added", "modified", "removed"].includes(c.status)) continue;
          const files = {};
          for (const l of ["en", "ko"]) {
            const f = c.files?.[l];
            if (!ADR_PATH.test(f?.path) || !FILE_ST.includes(f.status))
              continue;
            const bp = ADR_PATH.test(f.basePath) ? f.basePath : null;
            files[l] = { path: f.path, status: f.status, basePath: bp };
          }
          adrs.set(c.id, {
            id: c.id,
            status: c.status,
            title: str(c.title),
            files,
          });
        }
        if (!adrs.size) return null;
        const sha = (v) => (/^[0-9a-f]{7,40}$/.test(v) ? v : "");
        const base = str(j.base) || "main";
        const head = str(j.head) || builtRef;
        const baseSha = sha(j.baseSha);
        const headSha = sha(j.headSha);
        return {
          base,
          baseRef: baseSha || base,
          compare: `https://github.com/${REPO}/compare/${encodeURI(
            baseSha && headSha
              ? `${baseSha}...${headSha}`
              : `${base}...${head}`,
          )}`,
          adrs: new Map([...adrs].sort(([a], [b]) => a.localeCompare(b))),
          architecture: j.architecture || {},
        };
      }
      // Only a deployed preview (adr-ref filled at deploy) ships changes.json.
      const changesP =
        builtRef && !ref
          ? fetch("changes.json", { cache: "no-cache" })
              .then((r) => (r.ok ? r.json() : null))
              .then(readChanges)
              .catch(() => null)
          : Promise.resolve(null);
      const changeOf = (id) => S.changes?.adrs.get(id) || null;
      const fileOf = (c, l = S.lang) => c?.files[l] || null;
      const archFile = (l) =>
        l === "ko" ? "ARCHITECTURE.ko.md" : "ARCHITECTURE.md";
      const sourceOf = (file, gone) => ({
        fetch: (gone ? "base/" : "") + "adr/" + file,
        repo: "docs/adr/" + file,
        blob: blobUrl("docs/adr/" + file, gone ? S.changes.baseRef : blobRef),
        ref: gone ? S.changes.base : viewRef,
      });

      const store = {
        get: (k) => {
          try {
            return localStorage.getItem("adr-viewer:" + k);
          } catch {
            return null;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem("adr-viewer:" + k, v);
          } catch {}
        },
      };

      const S = {
        lang: null,
        route: null,
        idx: new Map(),
        docs: new Map(),
        ready: new Set(),
        view: 0,
        corpus: new Map(),
        text: {},
        heads: [],
        highlight: null,
        query: "",
        shown: null,
        changes: null,
      };
      changesP.then((c) => (S.changes = c));
      const els = {
        shell: $(".shell"),
        doc: $(".doc"),
        nav: $(".adr-nav"),
        toc: $(".toc"),
        input: $(".search input"),
        status: $(".search-status"),
      };

      const memo = (map, key, fn) => {
        if (!map.has(key))
          map.set(
            key,
            fn().catch((e) => {
              map.delete(key);
              throw e;
            }),
          );
        return map.get(key);
      };

      const decode = (s) => {
        try {
          return decodeURIComponent(s);
        } catch {
          return s;
        }
      };
      function parseHash() {
        const raw = location.hash.replace(/^#\/?/, "");
        const qi = raw.indexOf("?");
        const path = qi < 0 ? raw : raw.slice(0, qi);
        const q = new URLSearchParams(qi < 0 ? "" : raw.slice(qi + 1));
        const [first, ...rest] = path.split("/");
        const id = /^\d{4}$/.test(first) ? first : null;
        const anchor = id && rest.length ? decode(rest.join("/")) : null;
        const l = q.get("lang");
        return {
          id,
          anchor,
          lang: l === "ko" || l === "en" ? l : null,
          view: id && q.get("view") === "diff" ? "diff" : null,
        };
      }
      const href = (id, anchor, l = S.lang, v = null) =>
        `#/${id ? id + (anchor ? "/" + encodeURIComponent(anchor) : "") : ""}?${v === "diff" ? "view=diff&" : ""}lang=${l}`;

      async function fetchText(path) {
        const r = await fetch(
          srcUrl(path),
          viewRef ? { cache: "no-cache" } : undefined,
        );
        if (!r.ok)
          throw new Error(
            `${r.status} ${r.statusText || ""} — ${srcUrl(path)}`.trim(),
          );
        return r.text();
      }

      const base = new Marked({ gfm: true });
      const inline = new Parser({ gfm: true });
      const textOf = (tokens = []) =>
        inline.parseInline(tokens, inline.textRenderer);
      const stripNum = (s) => s.replace(/^\d{4}\s*[—–-]\s*/, "");

      function makeMarked() {
        const slugger = new GithubSlugger();
        const diagrams = [];
        const m = new Marked({
          gfm: true,
          renderer: {
            __proto__: Renderer.prototype,
            heading({ tokens, depth }) {
              const slug = slugger.slug(textOf(tokens));
              return `<h${depth} data-slug="${esc(slug)}">${this.parser.parseInline(tokens)}</h${depth}>\n`;
            },
            code({ text, lang }) {
              const l = (lang || "").trim().split(/\s+/)[0].toLowerCase();
              if (l === "mermaid") {
                diagrams.push(text);
                return `<figure class="diagram loading" data-i="${diagrams.length - 1}"></figure>`;
              }
              const hl = HL[l];
              return `<div class="code"${l ? ` data-lang="${esc(l)}"` : ""}><pre><code${hl ? ` data-hl="${hl}"` : ""}>${esc(text)}</code></pre></div>`;
            },
            table(token) {
              return `<div class="table-wrap">${super.table(token)}</div>`;
            },
          },
        });
        return { m, slugger, diagrams };
      }
      DOMPurify.addHook("afterSanitizeAttributes", (node) => {
        if (node.nodeName !== "INPUT") return;
        if (node.getAttribute("type") === "checkbox") node.disabled = true;
        else node.remove();
      });
      const sanitize = (html) =>
        DOMPurify.sanitize(html, {
          ADD_ATTR: ["target"],
          FORBID_TAGS: ["form", "button", "textarea", "select", "style"],
        });
      const sanitizeSvg = (svg) =>
        DOMPurify.sanitize(svg, {
          USE_PROFILES: { svg: true, svgFilters: true, html: true },
          ADD_TAGS: ["foreignObject"],
          HTML_INTEGRATION_POINTS: { foreignobject: true },
        });

      let hljsP;
      const getHljs = () =>
        (hljsP ||= (async () => {
          const names = [...new Set(Object.values(HL))];
          const [core, ...langs] = await Promise.all([
            import(HLJS_URL + "core.min.js"),
            ...names.map((n) => import(`${HLJS_URL}languages/${n}.min.js`)),
          ]);
          const hljs = core.default;
          names.forEach((n, i) => hljs.registerLanguage(n, langs[i].default));
          return hljs;
        })());
      async function highlightCode(root) {
        const blocks = $$("code[data-hl]", root);
        if (!blocks.length) return;
        const hljs = await getHljs().catch(() => null);
        if (!hljs) return;
        for (const c of blocks) {
          c.innerHTML = hljs.highlight(c.textContent, {
            language: c.dataset.hl,
            ignoreIllegals: true,
          }).value;
        }
      }

      const loadIndex = (lang) => memo(S.idx, lang, () => buildIndex(lang));
      const adrLink = (cell) =>
        cell?.tokens.find(
          (t) => t.type === "link" && /adr\/\d{4}-/.test(t.href),
        );

      async function buildIndex(lang) {
        const [md] = await Promise.all([fetchText(archFile(lang)), changesP]);
        const tokens = base.lexer(md);
        const ti = tokens.findIndex(
          (t) => t.type === "table" && t.rows.some((r) => adrLink(r[0])),
        );
        const entries = (tokens[ti]?.rows || [])
          .map((r) => {
            const link = adrLink(r[0]);
            if (!link) return null;
            const file = link.href.replace(/^\.?\/?adr\//, "");
            const id = /^(\d{4})/.exec(file)?.[1];
            return (
              id && {
                id,
                file,
                title: stripNum(textOf(link.tokens)),
                summaryHtml: inline.parseInline(r[1]?.tokens || []),
                summary: textOf(r[1]?.tokens),
              }
            );
          })
          .filter(Boolean);
        for (const c of S.changes?.adrs.values() || []) {
          const own = fileOf(c, lang);
          const e = entries.find((x) => x.id === c.id);
          if (e) {
            if (own?.status === "removed" || own?.status === "renamed")
              Object.assign(e, {
                file: own.path.slice(4),
                gone: own.status === "removed",
              });
            continue;
          }
          const f = own || c.files.en || c.files.ko;
          if (!f) continue;
          const at = entries.findIndex((x) => x.id > c.id);
          entries.splice(at < 0 ? entries.length : at, 0, {
            id: c.id,
            file: f.path.slice(4),
            gone: c.status === "removed" || f.status === "removed",
            title: c.title || c.id,
            summaryHtml: "",
            summary: "",
          });
        }
        return { tokens, ti, entries };
      }

      const loadPath = (path) =>
        memo(S.docs, path, () =>
          fetchText(path).then((md) => {
            S.ready.add(path);
            return md;
          }),
        );
      const loadDoc = (entry) =>
        loadPath(sourceOf(entry.file, entry.gone).fetch);

      function rewriteLinks(root, basePath, curId, diff) {
        for (const a of $$("a[href]", root)) {
          const raw = a.getAttribute("href");
          if (raw.startsWith("#/")) continue;
          if (/^[a-z][a-z\d+.-]*:/i.test(raw)) {
            if (/^https?:/i.test(raw)) {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              if (!a.querySelector("img")) a.classList.add("ext");
            }
            continue;
          }
          if (raw.startsWith("#")) {
            const anchor = decode(raw.slice(1));
            a.setAttribute("href", curId ? href(curId, anchor) : "#/");
            if (!diff) a.dataset.anchor = anchor;
            continue;
          }
          const u = new URL(raw, "https://repo.invalid/" + basePath);
          const path = decode(u.pathname.slice(1));
          const hash = decode(u.hash.slice(1));
          const adr = /^docs\/adr\/(\d{4})-[^/]*?(\.ko)?\.md$/.exec(path);
          const arch = /^docs\/ARCHITECTURE(\.ko)?\.md$/.exec(path);
          if (adr) {
            a.setAttribute(
              "href",
              href(adr[1], hash || null, adr[2] ? "ko" : "en"),
            );
          } else if (arch) {
            a.setAttribute("href", href(null, null, arch[1] ? "ko" : "en"));
          } else {
            const kind = raw.split(/[?#]/)[0].endsWith("/") ? "tree" : "blob";
            a.setAttribute(
              "href",
              blobUrl(path).replace("/blob/", `/${kind}/`) + (u.hash || ""),
            );
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.classList.add("ext");
          }
        }
      }

      function enhance(root, basePath, curId, diagrams, t, diff = false) {
        if (!diff)
          for (const h of $$("[data-slug]", root)) {
            h.id = h.dataset.slug;
            if (curId) {
              const a = document.createElement("a");
              a.className = "h-anchor";
              a.textContent = "#";
              a.setAttribute("href", href(curId, h.id));
              a.dataset.anchor = h.id;
              a.setAttribute("aria-hidden", "true");
              h.prepend(a);
            }
          }
        rewriteLinks(root, basePath, curId, diff);
        for (const c of $$("div.code", root))
          c.insertAdjacentHTML(
            "beforeend",
            `<button class="copy" type="button">${icon(ICON.copy)}<span>${t.copy}</span></button>`,
          );
        if (curId) {
          for (const el of root.children) {
            if (el.tagName === "H2") break;
            if (el.tagName === "BLOCKQUOTE") {
              el.classList.add("amend");
              el.dataset.label = t.amend;
              el.insertAdjacentHTML("afterbegin", icon(ICON.info));
            }
          }
        }
        for (const f of $$("figure.diagram", root))
          f._src = diagrams[+f.dataset.i];
      }

      function lcs(a, b) {
        const dp = Array.from(
          { length: a.length + 1 },
          () => new Uint32Array(b.length + 1),
        );
        for (let i = a.length - 1; i >= 0; i--)
          for (let j = b.length - 1; j >= 0; j--)
            dp[i][j] =
              a[i] === b[j]
                ? dp[i + 1][j + 1] + 1
                : Math.max(dp[i + 1][j], dp[i][j + 1]);
        const ops = [];
        let i = 0;
        let j = 0;
        while (i < a.length || j < b.length) {
          if (i < a.length && j < b.length && a[i] === b[j])
            ops.push(["=", i++, j++]);
          else if (
            j >= b.length ||
            (i < a.length && dp[i + 1][j] >= dp[i][j + 1])
          )
            ops.push(["-", i++]);
          else ops.push(["+", null, j++]);
        }
        return ops;
      }
      const hasCode = (t) =>
        t.type === "code" || (t.tokens ?? t.items ?? []).some(hasCode);
      const blockKey = (t) =>
        hasCode(t) ? t.raw.trimEnd() : t.raw.replace(/\s+/g, " ").trim();
      const leadH1 = (ts) =>
        ts[0]?.type === "heading" && ts[0].depth === 1 ? ts[0] : null;

      function diffDoc(m, baseMd, headMd) {
        const lex = (md) => {
          const ts = md ? m.lexer(md) : [];
          return {
            links: ts.links || {},
            list: ts.filter((x) => x.type !== "space"),
          };
        };
        const a = lex(baseMd);
        const b = lex(headMd);
        const ha = leadH1(a.list);
        const hb = leadH1(b.list);
        const title = hb || ha;
        const same = ha && hb && blockKey(ha) === blockKey(hb);
        if (ha && (same || !b.list.length)) a.list.shift();
        if (hb && (same || !a.list.length)) b.list.shift();
        const links = { ...a.links, ...b.links };
        const one = (t) => m.parser(Object.assign([t], { links }));
        const wrap = (tag, ...ts) =>
          `<${tag} class="dblk${ts[0].type === "heading" ? " h" : ""}">${ts.map(one).join("")}</${tag}>`;
        const list = (d, n) => {
          const items = [];
          const marks = [];
          const ops = lcs(d.items.map(blockKey), n.items.map(blockKey));
          for (const [o, i, j] of ops) {
            items.push(o === "-" ? d.items[i] : n.items[j]);
            marks.push(o === "=" ? "" : o === "-" ? "del" : "ins");
          }
          return `<div class="dlist" data-marks="${marks.join(",")}">${one({ ...n, items })}</div>`;
        };
        let out = "";
        let dels = [];
        let adds = [];
        const flush = () => {
          if (!dels.length || !adds.length) {
            if (dels.length) out += wrap("del", ...dels);
            if (adds.length) out += wrap("ins", ...adds);
          } else
            for (let k = 0; k < Math.max(dels.length, adds.length); k++) {
              const d = dels[k];
              const n = adds[k];
              if (
                d?.type === "list" &&
                n?.type === "list" &&
                d.ordered === n.ordered
              )
                out += list(d, n);
              else out += (d ? wrap("del", d) : "") + (n ? wrap("ins", n) : "");
            }
          dels = [];
          adds = [];
        };
        const ops = lcs(a.list.map(blockKey), b.list.map(blockKey));
        for (const [o, i, j] of ops) {
          if (o === "=") {
            flush();
            out += one(b.list[j]);
          } else if (o === "-") dels.push(a.list[i]);
          else adds.push(b.list[j]);
        }
        flush();
        return { html: out, title: title && stripNum(textOf(title.tokens)) };
      }
      function markListItems(root) {
        for (const d of $$(".dlist", root)) {
          const marks = d.dataset.marks.split(",");
          const list = $(":scope > ul, :scope > ol", d);
          [...(list?.children || [])].forEach(
            (li, k) => marks[k] && li.classList.add("d-" + marks[k]),
          );
        }
      }

      let mermaidP;
      let renderSeq = 0;
      const getMermaid = () =>
        (mermaidP ||= import(MERMAID_URL).then((m) => m.default));
      const isDark = () => document.documentElement.dataset.theme === "dark";
      const MERMAID_VARS = {
        background: "--surface-2",
        primaryColor: "--mmd-node",
        primaryBorderColor: "--mmd-node-border",
        primaryTextColor: "--text",
        secondaryColor: "--mmd-accent",
        secondaryBorderColor: "--mmd-accent-border",
        tertiaryColor: "--mmd-tertiary",
        tertiaryBorderColor: "--mmd-tertiary-border",
        lineColor: "--mmd-line",
        textColor: "--mmd-text",
        clusterBkg: "--mmd-cluster",
        clusterBorder: "--mmd-cluster-border",
        edgeLabelBackground: "--surface-2",
        noteBkgColor: "--mmd-accent",
        noteBorderColor: "--mmd-accent-border",
        noteTextColor: "--mmd-note-text",
        actorBorder: "--mmd-actor-border",
        signalColor: "--mmd-signal",
        activationBkgColor: "--mmd-activation",
        activationBorderColor: "--mmd-activation-border",
      };
      function mermaidConfig() {
        const cs = getComputedStyle(document.documentElement);
        const v = Object.fromEntries(
          Object.entries(MERMAID_VARS).map(([k, p]) => [
            k,
            cs.getPropertyValue(p).trim(),
          ]),
        );
        if (isDark()) {
          v.darkMode = true;
          v.sequenceNumberColor = cs.getPropertyValue("--bg").trim();
        }
        return {
          startOnLoad: false,
          securityLevel: "strict",
          suppressErrorRendering: true,
          theme: "base",
          look: "classic",
          themeCSS:
            ".node rect,.cluster rect{rx:7px;ry:7px}.edgeLabel,.edgeLabel p{font-size:12.5px}.cluster-label{font-weight:600}",
          fontFamily:
            "'Pretendard Variable', Pretendard, system-ui, sans-serif",
          themeVariables: { fontSize: "14px", ...v },
          flowchart: {
            curve: "basis",
            padding: 14,
            nodeSpacing: 44,
            rankSpacing: 52,
          },
          sequence: {
            mirrorActors: false,
            actorMargin: 60,

            noteMargin: 12,
