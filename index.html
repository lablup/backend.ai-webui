<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Backend.AI">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#fff">
  <!-- CSP nonce source for Vite's module-preload helper: Vite reads this meta's
       nonce at runtime and stamps it on the <link rel="modulepreload"> tags it
       injects for code-split chunks, so they pass a strict script-src nonce
       policy. The web server substitutes {{nonce}} per request (empty in dev). -->
  <meta property="csp-nonce" nonce="{{nonce}}">
  <base href="/">
  <link rel="icon" href="manifest/favicon.ico">
  <link rel="apple-touch-icon" sizes="256x256" href="manifest/backend-ai.iconset/icon_256x256@2x.png">
  <link rel="icon" type="image/png" sizes="32x32" href="manifest/backend-ai.iconset/icon_32x32@1x.png">
  <link rel="icon" type="image/png" sizes="16x16" href="manifest/backend-ai.iconset/icon_16x16@1x.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="resources/fonts/roboto/roboto.css">
  <link rel="stylesheet" href="resources/fonts/ubuntu/ubuntu.css">
  <link rel="stylesheet" href="resources/webui.css">
  <!-- Theme-family signature effects (glass blur, stained gradient header),
       keyed on the data-theme-family attribute set by the bootstrap below. -->
  <link rel="stylesheet" href="resources/theme-families.css">
  <link rel="stylesheet" href="resources/custom.css">
  <script nonce="{{nonce}}" src="manifest/app.js"></script>
  <title>Backend.AI</title>
  <!-- Critical inline CSS: paints the page/splash backdrop immediately so there
       is no color flash before the stylesheet applies. The full splash (Diagonal
       Weave) styling lives in resources/webui.css.

       The page backdrop is TOKEN-DRIVEN and mode-reactive, in that order:
         1. `html[data-theme]` -> `color-scheme` is duplicated from Astryx's
            reset.css here so the mapping exists BEFORE any external stylesheet
            loads. The boot script below writes the attribute from the stored
            themeMode; once React mounts, Astryx's root `<Theme>` owns the very
            same attribute (`useRootThemeSync`) and rewrites it on every mode
            flip. One attribute, one owner at a time, always reactive.
         2. `--color-background-body` is the Astryx page-surface token
            (`light-dark(#F7F7F6, #191919)` in the brand theme — the measured
            LEGACY antd page backdrop; see ANTD_NEUTRAL_SURFACES in
            `react/src/astryx-theme/backendAiTheme.ts`). It resolves
            against `color-scheme`, so a mode flip repaints with NO JavaScript.
            The literal `light-dark()` fallback covers the window before the
            theme CSS is parsed.
       Do NOT reintroduce an inline `document.body.style.backgroundColor`
       assignment here: an inline style outranks every rule above and froze the
       backdrop at its boot-time value, so toggling the theme mid-session left
       the page painting the previous mode until a reload. -->
  <!-- `--bai-z-splash` mirrors the ladder in
       `packages/backend.ai-ui/src/styles/zIndexLadder.ts`; this file is parsed
       before any JS, so it cannot import it. verify.sh's z-index ladder gate
       fails on drift. -->
  <style nonce="{{nonce}}">
    :root { --bai-z-splash: 900; }
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    body { margin: 0; background-color: var(--color-background-body, light-dark(#F7F7F6, #191919)); }
    #splash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: var(--bai-z-splash); display: flex; align-items: center; justify-content: center;
      background-color: var(--color-background-body, light-dark(#F7F7F6, #191919));
      transition: opacity 0.3s ease-out;
    }
    .splash-hidden { opacity: 0; pointer-events: none; }
  </style>
  <script nonce="{{nonce}}">
    globalThis.isElectron = isElectron();
    if (isElectron) {
      globalThis.electronInitialHref = window.location.href;
    }
    globalThis.enableSW = true;

    globalThis.packageVersion = "26.9.0-rc.1";
    globalThis.buildNumber = "8736";
    globalThis.baiNonce = "{{nonce}}";

    // DO NOT CHANGE BELOW LINE
    // DEV_JS_INJECTING
  </script>
  <!-- DO NOT CHANGE BELOW LINE -->
  <!-- REACT_BUNDLE_INJECTING FOR DEV-->
</head>

<body>
  <script nonce="{{nonce}}">
    //To avoid flickering when first loading the page, we add a class to the body to indicate the theme.
    const storedThemeMode = localStorage.getItem('backendaiwebui.settings.themeMode');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    // The storage-state hook stores JSON-serialized values, so parse the stored themeMode
    let parsedThemeMode;
    try { parsedThemeMode = storedThemeMode ? JSON.parse(storedThemeMode) : null; } catch(e) { parsedThemeMode = null; }
    if (parsedThemeMode === 'dark') {
      globalThis.isDarkMode = true;
    } else if (parsedThemeMode === 'light') {
      globalThis.isDarkMode = false;
    } else {
      // 'system' or unset: use system preference
      globalThis.isDarkMode = systemPrefersDark;
    }
    if (globalThis.isDarkMode) {
      document.body.classList.add('dark-theme');
    }
    // Seed Astryx's own mode attribute before first paint (the pattern its docs
    // prescribe for SSR: `<html data-theme="dark">`). The critical CSS above maps
    // it to `color-scheme`, so every `light-dark()` token — including the page
    // backdrop — resolves correctly on the very first frame. React's root
    // `<Theme>` takes ownership of this attribute on mount and keeps it in sync
    // with `useThemeMode` from then on.
    document.documentElement.setAttribute('data-theme', globalThis.isDarkMode ? 'dark' : 'light');
    // Apply the selected theme family before paint so the data-theme-family
    // attribute keys resources/theme-families.css (glass/stained header effects)
    // on the first render. Mirrors the themeMode read above; useCustomThemeConfig owns
    // this attribute once React mounts.
    var storedThemeFamily = localStorage.getItem('backendaiwebui.settings.themeFamily');
    var parsedThemeFamily;
    try { parsedThemeFamily = storedThemeFamily ? JSON.parse(storedThemeFamily) : null; } catch(e) { parsedThemeFamily = null; }
    document.body.setAttribute('data-theme-family', parsedThemeFamily || 'default');
  </script>
  <div>
    <div id="react-root"></div>
    <div id="splash" class="splash">
      <div class="splash-drag-area"></div>
      <!-- Diagonal Weave background: two woven line layers, drifting slowly -->
      <svg class="splash-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g transform="rotate(23 720 450)"><g id="splash-weaveA" class="splash-weave splash-drift"></g></g>
        <g transform="rotate(-23 720 450)"><g id="splash-weaveB" class="splash-weave splash-driftB"></g></g>
      </svg>
      <div class="splash-veil"></div>
      <!-- Centered logo + wire-cube loader -->
      <div class="splash-center">
        <div class="splash-logo" role="img" aria-label="Backend.AI"></div>
        <div class="splash-loader">
          <span class="splash-cube" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="22" height="22">
              <line class="edge" x1="20" y1="6" x2="31.9" y2="13" style="--i:2"></line>
              <line class="edge" x1="31.9" y1="13" x2="31.9" y2="27" style="--i:4"></line>
              <line class="edge" x1="31.9" y1="27" x2="20" y2="34" style="--i:5"></line>
              <line class="edge" x1="20" y1="34" x2="8.1" y2="27" style="--i:7"></line>
              <line class="edge" x1="8.1" y1="27" x2="8.1" y2="13" style="--i:8"></line>
              <line class="edge" x1="8.1" y1="13" x2="20" y2="6" style="--i:1"></line>
              <line class="edge" x1="20" y1="20" x2="20" y2="34" style="--i:6"></line>
              <line class="edge" x1="20" y1="20" x2="31.9" y2="13" style="--i:3"></line>
              <line class="edge" x1="20" y1="20" x2="8.1" y2="13" style="--i:0"></line>
            </svg>
          </span>
          <div id="loading-message" class="splash-msg">Loading components...</div>
        </div>
      </div>
      <!-- Corner metadata: version/build bottom-left, copyright bottom-right -->
      <div class="splash-meta">
        <div class="splash-meta-id">
          <div class="splash-meta-main">Backend.AI Web UI <span id="version-detail" class="splash-ver"></span></div>
          <div class="splash-meta-sub"><span id="mode-detail"></span><span id="build-detail"></span></div>
        </div>
        <div class="splash-meta-foot">Powered by open-source software &middot; Copyright &copy; 2015-2026 Lablup Inc.<span id="license-detail"></span></div>
      </div>
    </div>
    <noscript>
      <p>Could not render Backend.AI Web UI. Check that JavaScript is enabled.</p>
    </noscript>
    <!-- Backend.AI client classes are now initialized by React global-stores.ts -->
    <script nonce="{{nonce}}">
      document.getElementById('version-detail').innerText = globalThis.packageVersion;
      document.getElementById('build-detail').innerText = ' · Build ' + globalThis.buildNumber;
      document.getElementById('license-detail').innerText = '';
      if (globalThis.isElectron) {
        document.getElementById('mode-detail').innerText = 'App';
      } else {
        document.getElementById('mode-detail').innerText = 'WebServer';
      }

      // Diagonal Weave splash: build the woven line layers and prime the wire-cube loader.
      (function () {
        var NS = 'http://www.w3.org/2000/svg';
        var layerA = document.getElementById('splash-weaveA');
        var layerB = document.getElementById('splash-weaveB');
        if (layerA && layerB) {
          var spacing = 28, x1 = -1100, x2 = 2540, k = 0;
          for (var y = -1200; y < 1200; y += spacing) {
            var la = document.createElementNS(NS, 'line');
            la.setAttribute('x1', x1); la.setAttribute('y1', y);
            la.setAttribute('x2', x2); la.setAttribute('y2', y);
            if (k % 9 === 0) la.setAttribute('class', 'warm');
            layerA.appendChild(la);
            var lb = document.createElementNS(NS, 'line');
            lb.setAttribute('x1', x1); lb.setAttribute('y1', y);
            lb.setAttribute('x2', x2); lb.setAttribute('y2', y);
            layerB.appendChild(lb);
            k++;
          }
        }
        // Wire-cube loader: set each edge's dash length so the spiral draw animates.
        var edges = document.querySelectorAll('#splash .splash-cube .edge');
        for (var i = 0; i < edges.length; i++) {
          var L = edges[i].getTotalLength();
          edges[i].style.setProperty('--L', L.toFixed(2));
          edges[i].style.strokeDasharray = L.toFixed(2);
          edges[i].style.strokeDashoffset = L.toFixed(2);
        }
      })();

      if (globalThis.isIE) {
        alert('Internet Explorer is not supported. Please visit with modern browsers.');
        document.getElementById('loading-message').innerText = 'Not supported browser.';
        document.getElementById('loading-message').style.color = 'red';
      }
      if (window.location.hostname !== '127.0.0.1' &&
        !window.location.hostname.endsWith('localhost') &&
        'enableSW' in globalThis &&
        globalThis.enableSW === true) {
        // Service worker routine.
        if ('serviceWorker' in navigator && globalThis.isElectron === false) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
          });
        }
      }

      // Splash lifecycle: loading -> (login-backdrop | removed).
      //
      // - window.__enterLoginBackdrop(): called by LoginView when the login
      //   form becomes visible (logged-out). Keeps the weave + corner
      //   metadata as the login screen background, hides only the loader.
      // - window.__dismissSplash(): called by MainLayout when the authenticated
      //   UI is ready (logged-in). Fades out and removes the whole splash so it
      //   can't cover the app (it sits at --bai-z-splash, above page content).
      //
      // A MutationObserver + timers serve as fallbacks for routes that call
      // neither (e.g. /verify-email, /change-password).
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var state = 'loading'; // 'loading' | 'backdrop' | 'removed'
        var observer = null;
        var fallbackTimer = null;

        function clearFallbacks() {
          if (observer) { observer.disconnect(); observer = null; }
          if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
        }

        // Full removal (authenticated UI ready, or fallback).
        function dismiss() {
          if (state === 'removed') return;
          state = 'removed';
          clearFallbacks();
          splash.classList.add('splash-hidden');
          splash.addEventListener('transitionend', function handler(e) {
            if (e.propertyName === 'opacity') {
              splash.removeEventListener('transitionend', handler);
              if (splash.parentNode) splash.remove();
            }
          });
          // Safety net: remove even if transitionend never fires (e.g. prefers-reduced-motion)
          setTimeout(function () { if (splash.parentNode) splash.remove(); }, 1000);
        }

        // Transition to the login backdrop (logged-out login screen).
        function enterLoginBackdrop() {
          if (state !== 'loading') return;
          state = 'backdrop';
          // The backdrop must persist through the whole login flow, so cancel
          // the auto-removal fallbacks.
          clearFallbacks();
          splash.classList.add('splash-backdrop');
        }

        window.__dismissSplash = dismiss;
        window.__enterLoginBackdrop = enterLoginBackdrop;

        // Fallback: MutationObserver for routes that don't explicitly signal.
        var reactRoot = document.getElementById('react-root');
        if (reactRoot) {
          observer = new MutationObserver(function () {
            if (reactRoot.childNodes.length > 0) {
              observer.disconnect();
              observer = null;
              fallbackTimer = setTimeout(dismiss, 3000);
            }
          });
          observer.observe(reactRoot, { childList: true });
        }
        // Ultimate safety fallback — but never tear down an active login backdrop.
        setTimeout(function () { if (state !== 'backdrop') dismiss(); }, 10000);
      })();
    </script>
</body>

</html>
