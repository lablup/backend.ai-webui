# yaml-language-server: $schema=./schema.json
# The pre-node User type. Same vocabulary as UserNode; the user profile and the
# bulk-edit modals still read it.
type: User
docs: admin_menu#browse-and-manage-users
meaning: One user account, read through the pre-node API the profile and bulk-edit modals still use.
fields:
  status:
    label: Status
    meaning: Whether the account may sign in, and whether it still exists at all.
    docs: admin_menu#inactivate-user-account
    values:
      active:
        label: Active
        meaning: The account can sign in and use the WebUI normally.
        variant: success
      inactive:
        label: Inactive
        meaning: The account is disabled and cannot sign in, but its data is kept.
        variant: warning
      before-verification:
        label: Before Verification
        meaning: The account was created by sign-up and is waiting for its email to be verified.
        variant: info
      deleted:
        label: Deleted
        meaning: The account was purged; only an administrator sees it, and it cannot sign in.
        variant: error
  role:
    label: Role
    meaning: How far the account's built-in authority reaches, which decides the menus it sees.
    concept: rbac-role
    docs: admin_menu#browse-and-manage-users
    values:
      user:
        label: User
        meaning: An ordinary account, limited to its own sessions, folders and settings.
        concept: role-user
        variant: neutral
      admin:
        label: Admin
        meaning: A domain administrator, who manages the users and resources of its own domain.
        concept: role-domain-admin
        variant: blue
      superadmin:
        label: Superadmin
        meaning: An administrator of the whole installation, including agents, images and every domain.
        concept: role-superadmin
        variant: red
      monitor:
        label: Monitor
        meaning: A read-only account meant for monitoring integrations rather than for a person.
        variant: purple
  main_access_key:
    label: Main Access Key
    meaning: The keypair the WebUI acts under for this account when it has several.
    concept: keypair
    docs: admin_menu#manage-users-keypairs
  sudo_session_enabled:
    label: Sudo Session Enabled
    meaning: Whether the account's sessions may run commands as root inside their containers.
    docs: admin_menu#browse-and-manage-users
  groups:
    label: Projects
    meaning: The projects the account is a member of, which is what it can pick in the project selector.
    concept: project
    docs: admin_menu#browse-and-manage-users
