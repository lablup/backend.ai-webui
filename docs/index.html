<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Architecture Decision Records · Backend.AI WebUI</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.3.0/index.css"
    />
    <script>
      (() => {
        const t = localStorage.getItem("adr-viewer:theme");
        const dark = t
          ? t === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      :root {
        --font-sans:
          "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        --font-mono:
          "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo,
          "Pretendard Variable", monospace;
        --header-h: 56px;
        --sidebar-w: 288px;
        --toc-w: 232px;
        --radius: 10px;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --bg-soft: #fafafa;
        --surface: #f6f6f7;
        --surface-2: #fbfbfc;
        --border: #e8e8eb;
        --border-strong: #d6d6db;
        --text: #18181b;
        --text-2: #3f3f46;
        --muted: #71717a;
        --faint: #a1a1aa;
        --accent: #e8590c;
        --accent-text: #c2410c;
        --accent-soft: #fff4eb;
        --accent-line: #fdcfae;
        --hit: #fde68a;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --danger-line: #fecaca;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
        --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.12);
        --hl-keyword: #cf222e;
        --hl-string: #0a3069;
        --hl-number: #0550ae;
        --hl-comment: #6e7781;
        --hl-title: #8250df;
        --hl-type: #953800;
        --mmd-node: #ffffff;
        --mmd-node-border: #cfcfd6;
        --mmd-accent: #fff4eb;
        --mmd-accent-border: #f6b98a;
        --mmd-tertiary: #f6f6f7;
        --mmd-tertiary-border: #e1e1e6;
        --mmd-line: #8b8b95;
        --mmd-text: #27272a;
        --mmd-cluster: #f4f4f6;
        --mmd-cluster-border: #dcdce2;
        --mmd-note-text: #7c2d12;
        --mmd-actor-border: #c4c4cc;
        --mmd-signal: #52525b;
        --mmd-activation: #f1f1f4;
        --mmd-activation-border: #b4b4bc;
      }
      [data-theme="dark"] {
        --bg: #0c0c0e;
        --bg-soft: #0f0f12;
        --surface: #16161a;
        --surface-2: #121215;
        --border: #232328;
        --border-strong: #34343b;
        --text: #ececef;
        --text-2: #c9c9d0;
        --muted: #9a9aa4;
        --faint: #62626b;
        --accent: #ff8a3d;
        --accent-text: #ff9f5e;
        --accent-soft: #24170e;
        --accent-line: #5a3216;
        --hit: #6b4f0f;
        --danger: #f87171;
        --danger-soft: #1f1213;
        --danger-line: #4c1d1d;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.25);
        --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.6);
        --hl-keyword: #ff7b72;
        --hl-string: #a5d6ff;
        --hl-number: #79c0ff;
        --hl-comment: #8b949e;
        --hl-title: #d2a8ff;
        --hl-type: #ffa657;
        --mmd-node: #1d1d23;
        --mmd-node-border: #3f3f48;
        --mmd-accent: #2a1a0e;
        --mmd-accent-border: #7a3d14;
        --mmd-tertiary: #16161b;
        --mmd-tertiary-border: #34343b;
        --mmd-line: #8a8a94;
        --mmd-text: #d4d4da;
        --mmd-cluster: #141418;
        --mmd-cluster-border: #34343b;
        --mmd-note-text: #f5d0b0;
        --mmd-actor-border: #4a4a54;
        --mmd-signal: #b4b4bc;
        --mmd-activation: #2a2a31;
        --mmd-activation-border: #5a5a64;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings:
          "ss05",
          "tnum" 0;
        scroll-padding-top: calc(var(--header-h) + 24px);
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      ::selection {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        height: var(--header-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 20px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: saturate(1.6) blur(14px);
        -webkit-backdrop-filter: saturate(1.6) blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 650;
        font-size: 15px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #ff9a4d, #e8590c 60%, #c2410c);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.25),
          0 1px 2px rgb(194 65 12 / 0.4);
        color: #fff;
      }
      .brand-mark svg {
        width: 15px;
        height: 15px;
        stroke: #fff;
        stroke-width: 2.2;
      }
      .brand-sep {
        color: var(--faint);
        font-weight: 400;
      }
      .brand-sub {
        color: var(--muted);
        font-weight: 500;
      }
      .ref-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 6px 0 9px;
        border-radius: 999px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-text);
        font: 500 12px/1 var(--font-mono);
        text-decoration: none;
        max-width: 280px;
      }
      .ref-pill[hidden] {
        display: none;
      }
      .ref-pill span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ref-pill .x {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        opacity: 0.7;
      }
      .ref-pill:hover .x {
        opacity: 1;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .seg button {
        border: 0;
        background: none;
        height: 24px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .seg button[aria-pressed="true"] {
        background: var(--bg);
        color: var(--text);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.08),
          0 0 0 1px var(--border);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        text-decoration: none;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--surface);
      }
      .icon-btn svg.i {
        width: 18px;
        height: 18px;
      }
      .menu-btn {
        display: none;
        margin-left: -8px;
      }
      [data-theme="light"] .theme-btn .moon,
      [data-theme="dark"] .theme-btn .sun {
        display: none;
      }

      .shell {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
        min-height: calc(100vh - var(--header-h));
      }
      .shell.landing {
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 0;
      }
      .sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100vh - var(--header-h));
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--bg-soft);
        z-index: 30;
      }
      .search {
        position: relative;
        margin: 16px 14px 8px;
      }
      .search svg.i {
        position: absolute;
        left: 11px;
        top: 50%;
        translate: 0 -50%;
        color: var(--faint);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        height: 36px;
        padding: 0 36px 0 34px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search input::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      .search input::placeholder {
        color: var(--faint);
      }
      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .search kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        translate: 0 -50%;
        font: 500 11px/1 var(--font-mono);
        color: var(--faint);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3px 6px;
        background: var(--surface-2);
      }
      .search input:focus + kbd,
      .search input:not(:placeholder-shown) + kbd {
        display: none;
      }
      .search-status {
        margin: 0 16px 4px;
        min-height: 18px;
        font-size: 12px;
        color: var(--faint);
      }
      .adr-nav {
        flex: 1;
        overflow-y: auto;
        padding: 0 10px 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
      .nav-label,
      .toc-title {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .nav-label {
        display: flex;
        justify-content: space-between;
        margin: 18px 10px 6px;
      }
      .nav-item {
        position: relative;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: baseline;
        gap: 2px 6px;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13.5px;
        line-height: 1.4;
        color: var(--text-2);
        transition:
          background 0.12s,
          color 0.12s;
      }
      .nav-item:hover {
        background: var(--surface);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 550;
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }
      .nav-num {
        font: 500 11.5px/1.4 var(--font-mono);
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-item.active .nav-num {
        color: var(--accent-text);
        opacity: 0.75;
      }
      .nav-item.home {
        grid-template-columns: 38px 1fr;
      }
      .nav-item.home .nav-num {
        display: grid;
        place-items: start;
        padding-top: 2px;
      }
      .nav-count {
        font-size: 11px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-snip {
        grid-column: 2 / -1;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        font-weight: 400;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      mark {
        background: var(--hit);
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
      }
      mark.hit {
        padding: 0 2px;
      }
      .nav-empty {
        padding: 24px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--faint);
      }
      .scrim {
        display: none;
      }

      .main {
        min-width: 0;
        padding: 48px 56px 96px;
      }
      .doc {
        max-width: 46rem;
        margin: 0 auto;
        font-size: 16px;
        line-height: 1.72;
        color: var(--text-2);
        animation: fade-in 0.35s var(--ease);
      }
      .landing .doc {
        max-width: 60rem;
      }
      .doc:lang(ko) {
        word-break: keep-all;
        overflow-wrap: break-word;
        line-height: 1.78;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          translate: 0 6px;
        }
      }
      .doc-head {
        margin-bottom: 36px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--border);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--muted);
        background: var(--surface-2);
        text-decoration: none;
        white-space: nowrap;
      }
      .chip.num {
        font-family: var(--font-mono);
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-line);
        letter-spacing: 0.02em;
      }
      a.chip:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .doc h1 {
        margin: 0;
        font-size: clamp(1.85rem, 1.4rem + 1.6vw, 2.45rem);
        line-height: 1.18;
        font-weight: 720;
        letter-spacing: -0.028em;
        color: var(--text);
        text-wrap: balance;
      }
      .doc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 18px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .doc-meta a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .doc-meta a:hover {
        color: var(--accent-text);
      }
      .doc-meta svg.i {
        width: 14px;
        height: 14px;
      }
      .doc h2,
      .doc h3,
      .doc h4 {
        position: relative;
        color: var(--text);
        letter-spacing: -0.018em;
        scroll-margin-top: calc(var(--header-h) + 24px);
        text-wrap: balance;
      }
      .doc h2 {
        margin: 3.1em 0 0.8em;
        font-size: 1.5rem;
        line-height: 1.3;
        font-weight: 680;
      }
      .doc .prose > h2:first-child {
        margin-top: 0;
      }
      .doc h3 {
        margin: 2.2em 0 0.6em;
        font-size: 1.17rem;
        line-height: 1.4;
        font-weight: 650;
      }
      .doc h4 {
        margin: 1.8em 0 0.5em;
        font-size: 1rem;
        font-weight: 650;
      }
      .h-anchor {
        position: absolute;
        left: -1.1em;
        padding-right: 0.3em;
        color: var(--faint);
        text-decoration: none;
        font-weight: 400;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .doc h2:hover .h-anchor,
      .doc h3:hover .h-anchor,
      .doc h4:hover .h-anchor {
        opacity: 1;
      }
      .h-anchor:hover {
        color: var(--accent);
      }
      .doc p {
        margin: 0 0 1.1em;
      }
      .doc strong {
        color: var(--text);
        font-weight: 650;
      }
      .doc .prose a,
      .doc .lead a {
        color: var(--accent-text);
        text-decoration: underline;
        text-decoration-color: color-mix(
          in srgb,
          var(--accent) 35%,
          transparent
        );
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
        transition: text-decoration-color 0.15s;
      }
      .doc .prose a.card {
        color: inherit;
        text-decoration: none;
      }
      .doc .prose a:hover {
        text-decoration-color: currentColor;
      }
      .doc a.ext::after {
        content: "↗";
        font-size: 0.75em;
        margin-left: 0.15em;
        vertical-align: 0.15em;
        opacity: 0.7;
      }
      .doc ul,
      .doc ol {
        margin: 0 0 1.2em;
        padding-left: 1.4em;
      }
      .doc li {
        margin: 0.4em 0;
        padding-left: 0.2em;
      }
      .doc li > ul,
      .doc li > ol {
        margin: 0.4em 0;
      }
      .doc ul > li::marker {
        color: var(--faint);
      }
      .doc ol > li::marker {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.9em;
      }
      .doc hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 2.5em 0;
      }
      .doc code {
        font-family: var(--font-mono);
        font-size: 0.84em;
        font-variant-ligatures: none;
      }
      .doc :not(pre) > code {
        padding: 0.14em 0.4em;
        border-radius: 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        overflow-wrap: anywhere;
        word-break: normal;
      }
      .doc a > code {
        color: inherit;
      }
      .code {
        position: relative;
        margin: 1.4em 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        overflow: hidden;
      }
      .code[data-lang]::before {
        content: attr(data-lang);
        position: absolute;
        top: 9px;
        right: 12px;
        font: 600 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        transition: opacity 0.15s;
      }
      .code:hover::before {
        opacity: 0;
      }
      .code pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text);
        scrollbar-width: thin;
      }
      .code code {
        font-size: inherit;
      }
      .copy,
      .diagram .expand {
        position: absolute;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .code:hover .copy,
      .copy:focus-visible,
      .diagram.ok:hover .expand,
      .diagram .expand:focus-visible {
        opacity: 1;
      }
      .copy {
        top: 7px;
        right: 7px;
        gap: 5px;
        height: 26px;
        padding: 0 8px;
        border-radius: 6px;
      }
      .copy:hover {
        color: var(--text);
      }
      .copy svg.i {
        width: 13px;
        height: 13px;
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-meta .hljs-keyword {
        color: var(--hl-keyword);
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-template-string {
        color: var(--hl-string);
      }
      .hljs-number,
      .hljs-literal,
      .hljs-attr,
      .hljs-attribute,
      .hljs-property,
      .hljs-variable {
        color: var(--hl-number);
      }
      .hljs-comment,
      .hljs-quote {
        color: var(--hl-comment);
        font-style: italic;
      }
      .hljs-title,
      .hljs-title.function_,
      .hljs-selector-class,
      .hljs-selector-id,
      .hljs-section {
        color: var(--hl-title);
      }
      .hljs-built_in,
      .hljs-type,
      .hljs-title.class_,
      .hljs-selector-pseudo {

      .doc blockquote {

        position: absolute;
        left: 18px;
        top: 17px;
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .doc blockquote.amend + blockquote.amend {
        margin-top: -1.4em;

      .table-wrap {
        margin: 1.6em 0;

        width: 100%;

      .doc th,
      .doc td {
        padding: 10px 14px;

        vertical-align: top;

      .doc th {
        background: var(--surface);

      .doc tbody tr:hover td {
        background: var(--surface-2);

      .diagram {
        position: relative;
        margin: 1.8em 0;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background:
          radial-gradient(
              circle,
              color-mix(in srgb, var(--border-strong) 55%, transparent) 1px,
              transparent 1.2px
            )
            0 0 / 18px 18px,
          var(--surface-2);
        min-height: 140px;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .diagram.ok {
        cursor: zoom-in;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .diagram.ok:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      .diagram-scroll {
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .diagram.wide {
        place-items: stretch;
      }
      .diagram.wide::after {
        content: "";
        position: absolute;
        top: 1px;
        right: 1px;
        bottom: 1px;
        width: 48px;
        border-radius: 0 12px 12px 0;
        background: linear-gradient(90deg, transparent, var(--surface-2));
        pointer-events: none;

      .diagram svg[id^="mmd-"] {
        display: block;
        height: auto;
        margin: 0 auto;

      .diagram .expand {
        top: 10px;
        right: 10px;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 7px;

      .diagram.loading::after,
      .skeleton i {
        background: linear-gradient(
          90deg,
          var(--surface) 0%,
          var(--border) 50%,
          var(--surface) 100%

        background-size: 200% 100%;

      .diagram.loading::after {
        content: "";

        border-radius: 8px;

      @keyframes shimmer {

      .diagram.err {

        padding: 0;

      .err-head {

      .err-msg {

        padding: 12px 16px;

      .err-src {

        padding-right: 12px;

      .pager {

      .doc-foot {

        font-weight: 650;

        margin: 0;

      .toc {

        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

        display: flex;

        gap: 8px;
        border: 0;
        margin: 0;
        padding: 4px 12px;
      }

        width: 14px;
        height: 14px;

      .state {
        margin: 12vh auto 0;
        max-width: 28rem;
        text-align: center;

        color: var(--text);
        margin: 14px 0 6px;
        font-size: 1.25rem;

        display: inline-grid;

        height: 48px;
        border-radius: 12px;
        background: var(--surface);

        font-family: var(--font-mono);

      .skeleton {
        display: grid;
        gap: 14px;

        display: block;
        height: 14px;

        width: 70%;
        margin-bottom: 18px;

      .zoom {
        position: fixed;
        inset: 0;
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        color: inherit;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: fade 0.18s ease-out;
      }
      .zoom::backdrop {
        background: none;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .zoom-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
      }
      .zoom-stage.dragging {
        cursor: grabbing;
      }
      .zoom-canvas {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        padding: 24px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);

      .zoom-canvas svg {
        display: block;
        max-width: none !important;
      }
      .zoom-bar {
        position: absolute;
        left: 50%;
        bottom: 24px;
        translate: -50% 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
      }
      .zoom-bar button {
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        height: 32px;
        padding: 0 8px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--text-2);
        cursor: pointer;
        font-size: 13px;
        font-weight: 550;
      }
      .zoom-bar button:hover {
        background: var(--surface);
        color: var(--text);
      }
      .zoom-pct {
        min-width: 54px;
        text-align: center;
        font: 500 12.5px var(--font-mono);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .zoom-bar .sep {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: var(--border);
      }
      .zoom-hint {
        position: absolute;
        top: 18px;
        left: 50%;
        translate: -50% 0;
        margin: 0;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12.5px;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      body:has(.zoom[open]) {
        overflow: hidden;
      }

      @media (max-width: 1240px) {
        .shell,
        .shell.landing {
          grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        }
        .toc {
          display: none;
        }

      @media (max-width: 880px) {

        }

        .shell.landing {
          grid-template-columns: minmax(0, 1fr);

        .sidebar {

          top: 0;
          left: 0;
          bottom: 0;

          width: min(86vw, 320px);
          z-index: 60;

          transition: translate 0.28s var(--ease);
          box-shadow: none;
          padding-top: 8px;
        }
        body.nav-open .sidebar {
          translate: 0 0;
          box-shadow: var(--shadow-lg);

        .scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 55;
          background: rgb(0 0 0 / 0.36);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s;

          opacity: 1;
          pointer-events: auto;
        }
        .main {
          padding: 28px 20px 72px;
        }
        .brand-sep,
        .brand-sub {
          display: none;
        }
        .ref-pill {
          max-width: 120px;
        }
        .pager {
          grid-template-columns: 1fr;
        }
        .pager .next {
          grid-column: 1;
        }
        .h-anchor {
          display: none;
        }
        .diagram {
          padding: 18px 12px;
        }
        .doc blockquote.amend {
          padding-left: 18px;
        }
        .doc blockquote.amend > svg.i {
          display: none;
        }
        .zoom-hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

          zoomHint: "Scroll to zoom · Drag to pan · Esc to close",
          loadingIdx: "Indexing full text…",
          results: (n) => `${n} match${n === 1 ? "" : "es"}`,

        },
        ko: {
          search: "ADR 검색",
          overview: "개요",
          decisions: "결정 목록",
          onPage: "이 페이지에서",
          prev: "이전",
          next: "다음",
          github: "GitHub에서 보기",
          raw: "원본 markdown",
          top: "맨 위로",
          amend: "개정",
          expand: "확대",
          copy: "복사",
          copied: "복사됨",
          mmdErr: "Mermaid 다이어그램을 그리지 못했습니다",
          zoomHint: "스크롤로 확대 · 드래그로 이동 · Esc로 닫기",
          loadingIdx: "본문 색인 중…",
          results: (n) => `${n}건 일치`,
          none: "일치하는 결정이 없습니다.",
          notFound: "결정을 찾을 수 없습니다",
          notFoundBody: "색인에 이 번호의 ADR이 없습니다.",
          fail: "불러오지 못했습니다",
          inForce: "개 결정 발효 중",
          languages: "개 언어",
          source: "출처",
          lang: "한국어",
          clearRef: "게시된 사본으로 돌아가기",
        },
      };

      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const icon = (d, cls = "i") =>
        `<svg class="${cls}" viewBox="0 0 24 24">${d}</svg>`;
      const ICON = {
        gh: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
        up: '<path d="m18 15-6-6-6 6"/>',
        copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
        expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
        warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
        info: '<path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/>',
        pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>',
        home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
        branch:
          '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 5.5"/>',
        x: '<path d="M6 6l12 12M18 6 6 18"/>',
      };

      const ref = new URLSearchParams(location.search).get("ref");
      const blobRef = ref || "main";
      const srcUrl = (p) =>
        ref
          ? `https://raw.githubusercontent.com/${REPO}/${encodeURI(ref)}/docs/${p}`
          : p;
      const blobUrl = (p) =>
        `https://github.com/${REPO}/blob/${encodeURI(blobRef)}/${p}`;

      const store = {
        get: (k) => {
          try {
            return localStorage.getItem("adr-viewer:" + k);
          } catch {
            return null;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem("adr-viewer:" + k, v);
          } catch {}
        },
      };

      const S = {
        lang: null,
        route: null,
        idx: new Map(),
        docs: new Map(),
        corpus: new Map(),
        text: {},
        heads: [],
        highlight: null,
        query: "",
      };
      const els = {
        shell: $(".shell"),
        doc: $(".doc"),
        nav: $(".adr-nav"),
        toc: $(".toc"),
        input: $(".search input"),
        status: $(".search-status"),
      };

      const memo = (map, key, fn) => {
        if (!map.has(key))
          map.set(
            key,
            fn().catch((e) => {
              map.delete(key);
              throw e;
            }),
          );
        return map.get(key);
      };

      function parseHash() {
        const raw = location.hash.replace(/^#\/?/, "");
        const qi = raw.indexOf("?");
        const path = qi < 0 ? raw : raw.slice(0, qi);
        const q = new URLSearchParams(qi < 0 ? "" : raw.slice(qi + 1));
        const [first, ...rest] = path.split("/");
        const id = /^\d{4}$/.test(first) ? first : null;
        const anchor =
          id && rest.length ? decodeURIComponent(rest.join("/")) : null;
        const l = q.get("lang");
        return { id, anchor, lang: l === "ko" || l === "en" ? l : null };
      }
      const href = (id, anchor, l = S.lang) =>
        `#/${id ? id + (anchor ? "/" + encodeURIComponent(anchor) : "") : ""}?lang=${l}`;

      async function fetchText(path) {
        const r = await fetch(
          srcUrl(path),
          ref ? { cache: "no-cache" } : undefined,
        );
        if (!r.ok)
          throw new Error(
            `${r.status} ${r.statusText || ""} — ${srcUrl(path)}`.trim(),
          );
        return r.text();
      }

      const base = new Marked({ gfm: true });
      const inline = new Parser({ gfm: true });
      const textOf = (tokens = []) =>
        inline.parseInline(tokens, inline.textRenderer);
      const stripNum = (s) => s.replace(/^\d{4}\s*[—–-]\s*/, "");

      function makeMarked() {
        const slugger = new GithubSlugger();
        const diagrams = [];
        const m = new Marked({
          gfm: true,
          renderer: {
            __proto__: Renderer.prototype,
            heading({ tokens, depth }) {
              const slug = slugger.slug(textOf(tokens));
              return `<h${depth} data-slug="${esc(slug)}">${this.parser.parseInline(tokens)}</h${depth}>\n`;
            },
            code({ text, lang }) {
              const l = (lang || "").trim().split(/\s+/)[0].toLowerCase();
              if (l === "mermaid") {
                diagrams.push(text);
                return `<figure class="diagram loading" data-i="${diagrams.length - 1}"></figure>`;
              }
              const hl = HL[l];
              return `<div class="code"${l ? ` data-lang="${esc(l)}"` : ""}><pre><code${hl ? ` data-hl="${hl}"` : ""}>${esc(text)}</code></pre><button class="copy" type="button">${icon(ICON.copy)}<span>${T[S.lang].copy}</span></button></div>`;
            },
            table(token) {
              return `<div class="table-wrap">${super.table(token)}</div>`;
            },
          },
        });
        return { m, slugger, diagrams };
      }
      const sanitize = (html) =>
        DOMPurify.sanitize(html, { ADD_ATTR: ["target"] });

      let hljsP;
      const getHljs = () =>
        (hljsP ||= (async () => {
          const names = [...new Set(Object.values(HL))];
          const [core, ...langs] = await Promise.all([
            import(HLJS_URL + "core.min.js"),
            ...names.map((n) => import(`${HLJS_URL}languages/${n}.min.js`)),
          ]);
          const hljs = core.default;
          names.forEach((n, i) => hljs.registerLanguage(n, langs[i].default));
          return hljs;
        })());
      async function highlightCode(root) {
        const blocks = $$("code[data-hl]", root);
        if (!blocks.length) return;
        const hljs = await getHljs().catch(() => null);
        if (!hljs) return;
        for (const c of blocks) {
          c.innerHTML = hljs.highlight(c.textContent, {
            language: c.dataset.hl,
            ignoreIllegals: true,
          }).value;
        }
      }

      const loadIndex = (lang) => memo(S.idx, lang, () => buildIndex(lang));
      const adrLink = (cell) =>
        cell?.tokens.find(
          (t) => t.type === "link" && /adr\/\d{4}-/.test(t.href),
        );

      async function buildIndex(lang) {
        const md = await fetchText(
          lang === "ko" ? "ARCHITECTURE.ko.md" : "ARCHITECTURE.md",
        );
        const tokens = base.lexer(md);
        const ti = tokens.findIndex(
          (t) => t.type === "table" && t.rows.some((r) => adrLink(r[0])),
        );
        const entries = (tokens[ti]?.rows || [])
          .map((r) => {
            const link = adrLink(r[0]);
            if (!link) return null;
            const file = link.href.replace(/^\.?\/?adr\//, "");
            const id = /^(\d{4})/.exec(file)?.[1];
            return (
              id && {
                id,
                file,
                title: stripNum(textOf(link.tokens)),
                summaryHtml: inline.parseInline(r[1]?.tokens || []),
                summary: textOf(r[1]?.tokens),
              }
            );
          })
          .filter(Boolean);
        return { tokens, ti, entries };
      }

      const loadDoc = (entry) =>
        memo(S.docs, entry.file, () => fetchText("adr/" + entry.file));

      function rewriteLinks(root, basePath, curId) {
        for (const a of $$("a[href]", root)) {
          const raw = a.getAttribute("href");
          if (raw.startsWith("#/")) continue;
          if (/^[a-z][a-z\d+.-]*:/i.test(raw)) {
            if (/^https?:/i.test(raw)) {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              if (!a.querySelector("img")) a.classList.add("ext");
            }
            continue;
          }
          if (raw.startsWith("#")) {
            const anchor = decodeURIComponent(raw.slice(1));
            a.setAttribute("href", curId ? href(curId, anchor) : "#/");
            a.dataset.anchor = anchor;
            continue;
          }
          const u = new URL(raw, "https://repo.invalid/" + basePath);
          const path = decodeURIComponent(u.pathname.slice(1));
          const hash = decodeURIComponent(u.hash.slice(1));
          const adr = /^docs\/adr\/(\d{4})-[^/]*?(\.ko)?\.md$/.exec(path);
          const arch = /^docs\/ARCHITECTURE(\.ko)?\.md$/.exec(path);
          if (adr) {
            a.setAttribute(
              "href",
              href(adr[1], hash || null, adr[2] ? "ko" : "en"),
            );
          } else if (arch) {
            a.setAttribute("href", href(null, null, arch[1] ? "ko" : "en"));
          } else {
            const kind = raw.split(/[?#]/)[0].endsWith("/") ? "tree" : "blob";
            a.setAttribute(
              "href",
              blobUrl(path).replace("/blob/", `/${kind}/`) + (u.hash || ""),
            );
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.classList.add("ext");
          }
        }
      }

      function enhance(root, basePath, curId, diagrams, t) {
        for (const h of $$("[data-slug]", root)) {
          h.id = h.dataset.slug;
          if (curId) {
            const a = document.createElement("a");
            a.className = "h-anchor";
            a.textContent = "#";
            a.setAttribute("href", href(curId, h.id));
            a.dataset.anchor = h.id;
            a.setAttribute("aria-hidden", "true");
            h.prepend(a);
          }
        }
        rewriteLinks(root, basePath, curId);
        if (curId) {
          for (const el of root.children) {
            if (el.tagName === "H2") break;
            if (el.tagName === "BLOCKQUOTE") {
              el.classList.add("amend");
              el.dataset.label = t.amend;
              el.insertAdjacentHTML("afterbegin", icon(ICON.info));
            }
          }
        }
        for (const f of $$("figure.diagram", root))
          f._src = diagrams[+f.dataset.i];
      }

      let mermaidP;
      let renderSeq = 0;
      const getMermaid = () =>
        (mermaidP ||= import(MERMAID_URL).then((m) => m.default));
      const isDark = () => document.documentElement.dataset.theme === "dark";
      const MERMAID_VARS = {
        background: "--surface-2",
        primaryColor: "--mmd-node",
        primaryBorderColor: "--mmd-node-border",
        primaryTextColor: "--text",
        secondaryColor: "--mmd-accent",
        secondaryBorderColor: "--mmd-accent-border",
        tertiaryColor: "--mmd-tertiary",
        tertiaryBorderColor: "--mmd-tertiary-border",
        lineColor: "--mmd-line",
        textColor: "--mmd-text",
        clusterBkg: "--mmd-cluster",
        clusterBorder: "--mmd-cluster-border",
        edgeLabelBackground: "--surface-2",
        noteBkgColor: "--mmd-accent",
        noteBorderColor: "--mmd-accent-border",
        noteTextColor: "--mmd-note-text",
        actorBorder: "--mmd-actor-border",
        signalColor: "--mmd-signal",
        activationBkgColor: "--mmd-activation",
        activationBorderColor: "--mmd-activation-border",
      };
      function mermaidConfig() {
        const cs = getComputedStyle(document.documentElement);
        const v = Object.fromEntries(
          Object.entries(MERMAID_VARS).map(([k, p]) => [
            k,
            cs.getPropertyValue(p).trim(),
          ]),
        );
        if (isDark()) {
          v.darkMode = true;
          v.sequenceNumberColor = cs.getPropertyValue("--bg").trim();
        }
        return {
          startOnLoad: false,
          securityLevel: "strict",
          suppressErrorRendering: true,
          theme: "base",
          look: "classic",
          themeCSS:
            ".node rect,.cluster rect{rx:7px;ry:7px}.edgeLabel,.edgeLabel p{font-size:12.5px}.cluster-label{font-weight:600}",
          fontFamily:
            "'Pretendard Variable', Pretendard, system-ui, sans-serif",
          themeVariables: { fontSize: "14px", ...v },
          flowchart: {
            curve: "basis",
            padding: 14,
            nodeSpacing: 44,
            rankSpacing: 52,
          },
          sequence: {
            mirrorActors: false,
            actorMargin: 60,
            boxMargin: 8,
            noteMargin: 12,
          },
          state: { padding: 10 },
        };
      }

      async function renderDiagrams(root) {
        const figs = $$("figure.diagram", root);
        if (!figs.length) return;
        const seq = ++renderSeq;
        root.dataset.diagrams = "pending";
        let mermaid;
        try {
          mermaid = await getMermaid();
        } catch (e) {
          figs.forEach((f) => showDiagramError(f, e));
          root.dataset.diagrams = "done";
          return;
        }
        if (seq !== renderSeq) return;
        mermaid.initialize(mermaidConfig());
        await document.fonts
          .load(
            '14px "Pretendard Variable"',
            figs
              .map((f) => f._src)
              .join(" ")
              .replace(/\s+/g, " "),
          )
          .catch(() => {});
        for (const [k, f] of figs.entries()) {
          if (seq !== renderSeq) return;
          try {
            const { svg } = await mermaid.render(`mmd-${seq}-${k}`, f._src);
            if (seq !== renderSeq) return;
            f.className = "diagram ok";
            f.innerHTML = `<div class="diagram-scroll">${svg}</div>`;
            fitDiagram(f);
            f.insertAdjacentHTML(
              "beforeend",
              `<button class="expand" type="button">${icon(ICON.expand)}${T[S.lang].expand}</button>`,
            );
          } catch (e) {
            if (seq !== renderSeq) return;
            showDiagramError(f, e);
          }
        }
        root.dataset.diagrams = "done";
      }

      function fitDiagram(f, width = f.clientWidth) {
        const svg = $("svg", f);
        const w = svg?.viewBox?.baseVal?.width;
        if (!w) return;
        const avail = width - 48;
        svg.style.width =
          (w > avail ? Math.min(w, Math.max(avail, w * 0.62)) : w) + "px";
        svg.style.maxWidth = "none";
        f.classList.toggle("wide", w * 0.62 > avail);
      }

      function showDiagramError(f, e) {
        const t = T[S.lang];
        const msg = String(e?.message || e || "Unknown error").trim();
        const line =
          e?.hash?.loc?.first_line ||
          +(/line\s+(\d+)/i.exec(msg)?.[1] || 0) ||
          0;
        const src = (f._src || "")
          .split("\n")
          .map(
            (l, i) =>
              `<span${i + 1 === line ? ' class="bad"' : ""}>${esc(l) || " "}</span>`,
          )
          .join("");
        f.className = "diagram err";
        f.innerHTML = `<div class="err-head">${icon(ICON.warn)}${t.mmdErr}</div><pre class="err-msg">${esc(msg)}</pre><pre class="err-src">${src}</pre>`;
      }

      function setLoading() {
        els.doc.innerHTML = `<div class="skeleton"><i></i>${[
          92, 100, 84, 96, 60, 0, 88, 100, 72,
        ]
          .map((w) => (w ? `<i style="width:${w}%"></i>` : "<br>"))
          .join("")}</div>`;
      }

      function showState(title, body, glyph = ICON.warn) {
        els.doc.innerHTML = `<div class="state"><span class="glyph">${icon(glyph)}</span><h2>${esc(title)}</h2><p>${body}</p><p><a class="chip" href="${href(null)}">${icon(ICON.home)}${T[S.lang].overview}</a></p></div>`;
        els.toc.innerHTML = "";
        S.heads = [];
      }

      async function showLanding(opts = {}) {
        const t = T[S.lang];
        els.shell.classList.add("landing");
        const { tokens, ti, entries } = await loadIndex(S.lang);
        const { m, slugger } = makeMarked();
        const h1 = tokens.findIndex(
          (x) => x.type === "heading" && x.depth === 1,
        );
        const title =
          h1 >= 0 ? textOf(tokens[h1].tokens) : "Architecture overview";
        if (h1 >= 0) slugger.slug(title);
        const firstH2 = tokens.findIndex(
          (x, i) => i > h1 && x.type === "heading",
        );
        const lead = tokens.slice(h1 + 1, firstH2 < 0 ? ti : firstH2);
        const mid = tokens.slice(firstH2 < 0 ? ti : firstH2, ti);
        const rest = tokens.slice(ti + 1);
        const part = (arr) =>
          m.parser(Object.assign(arr, { links: tokens.links }));
        const cards = entries
          .map(
            (e) =>
              `<a class="card" href="${href(e.id)}"><div class="card-top"><span class="chip num">ADR ${e.id}</span><span class="arrow">→</span></div><h3>${esc(e.title)}</h3><p>${e.summaryHtml.replace(/<\/?a\b[^>]*>/g, "")}</p></a>`,
          )
          .join("");
        const html = `<header class="hero"><div class="eyebrow"><span class="chip">Backend.AI WebUI</span>${ref ? `<span class="chip">${icon(ICON.branch)}${esc(ref)}</span>` : ""}</div><h1>${esc(title)}</h1><div class="lead">${part(lead)}</div><div class="stats"><span class="stat"><b>${entries.length}</b>${t.inForce}</span><span class="stat"><b>2</b>${t.languages}</span></div></header><div class="prose">${part(mid)}<div class="cards">${cards}</div>${part(rest)}</div>`;
        els.doc.innerHTML = sanitize(html);
        els.doc.lang = S.lang;
        enhance(
          els.doc,
          S.lang === "ko" ? "docs/ARCHITECTURE.ko.md" : "docs/ARCHITECTURE.md",
          null,
          [],
          t,
        );
        highlightCode(els.doc);
        els.toc.innerHTML = "";
        S.heads = [];
        document.title = `${title} · Backend.AI WebUI ADR`;
        opts.keep ? restorePosition(opts.keep) : scrollTo(0, 0);
      }

      async function showAdr(id, anchor, opts = {}) {
        const t = T[S.lang];
        els.shell.classList.remove("landing");
        const idx = await loadIndex(S.lang);
        const i = idx.entries.findIndex((e) => e.id === id);
        if (i < 0)
          return showState(
            t.notFound,
            `${esc(t.notFoundBody)} <code>${esc(id)}</code>`,
          );
        const entry = idx.entries[i];
        const cached = S.docs.has(entry.file);
        if (!cached && !opts.keep) {
          setLoading();
          scrollTo(0, 0);
        }
        let md;
        try {
          md = await loadDoc(entry);
        } catch (e) {
          return showState(t.fail, `<code>${esc(e.message)}</code>`);
        }
        if (S.route?.id !== id) return;
        const { m, slugger, diagrams } = makeMarked();
        const tokens = m.lexer(md);
        let title = entry.title;
        if (tokens[0]?.type === "heading" && tokens[0].depth === 1) {
          const h1 = textOf(tokens.shift().tokens);
          title = stripNum(h1);
          slugger.slug(h1);
        }
        const prev = idx.entries[i - 1];
        const next = idx.entries[i + 1];
        const repoPath = `docs/adr/${entry.file}`;
        const html = `
          <header class="doc-head">
            <div class="eyebrow"><span class="chip num">ADR ${id}</span><span class="chip">${t.lang}</span>${ref ? `<span class="chip">${icon(ICON.branch)}${esc(ref)}</span>` : ""}</div>
            <h1>${esc(title)}</h1>
            <div class="doc-meta">
              <a href="${blobUrl(repoPath)}" target="_blank" rel="noopener">${icon(ICON.gh)}${t.github}</a>
              <a href="${srcUrl("adr/" + entry.file)}" target="_blank" rel="noopener">${icon(ICON.file)}${t.raw}</a>
            </div>
          </header>
          <div class="prose">${m.parser(tokens)}</div>
          <nav class="pager">
            ${prev ? `<a class="prev" href="${href(prev.id)}"><small>← ${t.prev}</small><strong><span class="n">${prev.id}</span>${esc(prev.title)}</strong></a>` : ""}
            ${next ? `<a class="next" href="${href(next.id)}"><small>${t.next} →</small><strong><span class="n">${next.id}</span>${esc(next.title)}</strong></a>` : ""}
          </nav>
          <footer class="doc-foot"><span>${t.source}: <a href="${blobUrl(repoPath)}" target="_blank" rel="noopener">${esc(repoPath)}</a> @ ${esc(blobRef)}</span><a href="#" data-top>${t.top} ↑</a></footer>`;
        els.doc.innerHTML = sanitize(html);
        els.doc.lang = S.lang;
        const prose = $(".prose", els.doc);
        enhance(prose, repoPath, id, diagrams, t);
        highlightCode(prose);
        document.title = `${id} — ${title} · Backend.AI WebUI ADR`;
        buildToc(id, entry);
        if (S.highlight) {
          const first = markHits(prose, S.highlight);
          S.highlight = null;
          if (first && !anchor) {
            requestAnimationFrame(() =>
              first.scrollIntoView({ block: "center" }),
            );
          }
        }
        pin(null);
        if (opts.keep) restorePosition(opts.keep);
        else if (anchor) scrollToAnchor(anchor, false);
        else if (!S.pendingFirst) scrollTo(0, 0);
        renderDiagrams(prose).then(spy);
        spy();
      }

      function buildToc(id, entry) {
        const t = T[S.lang];
        const hs = $$(".prose > h2, .prose > h3", els.doc);
        S.heads = hs;
        els.toc.innerHTML = sanitize(
          `<p class="toc-title">${t.onPage}</p><ol>${hs
            .map(
              (h) =>
                `<li><a class="l${h.tagName[1]}" href="${href(id, h.id)}" data-anchor="${esc(h.id)}">${esc(h.textContent.replace(/^#/, ""))}</a></li>`,
            )
            .join(
              "",
            )}</ol><div class="toc-extra"><a href="#" data-top>${icon(ICON.up)}${t.top}</a><a href="${blobUrl("docs/adr/" + entry.file)}" target="_blank" rel="noopener">${icon(ICON.gh)}${t.github}</a></div>`,
        );
        els.toc.scrollTop = 0;
      }

      function reveal(el, box, pad = 0) {
        const r = el.getBoundingClientRect();
        const b = box.getBoundingClientRect();
        if (r.top < b.top + pad || r.bottom > b.bottom - pad)
          box.scrollTop += r.top - b.top - b.height / 3;
      }

      function spy() {
        if (!S.heads.length) return;
        let cur = S.heads[0];
        for (const h of S.heads) {
          if (h.getBoundingClientRect().top <= 120) cur = h;
          else break;
        }
        if (
          innerHeight + scrollY >=
          document.documentElement.scrollHeight - 4
        ) {
          cur = S.heads.at(-1);
        }
        for (const a of $$(".toc ol a")) {
          const on = a.dataset.anchor === cur.id;
          if (on !== a.classList.contains("active")) {
            a.classList.toggle("active", on);
            if (on) reveal(a, els.toc, 40);
          }
        }
      }
      let spyRaf = 0;
      addEventListener(
        "scroll",
        () => {
          cancelAnimationFrame(spyRaf);
          spyRaf = requestAnimationFrame(spy);
        },
        { passive: true },
      );

      const docHeight = () =>
        Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const sections = () =>
        $$(".prose > h2, .prose > h3, .prose > h4", els.doc);
      function capturePosition() {
        if (!S.heads.length) return { ratio: scrollY / docHeight() };
        const all = sections();
        let i = -1;
        all.forEach((h, k) => {
          if (h.getBoundingClientRect().top <= 100) i = k;
        });
        if (i < 0) return { head: -1, frac: 0, y: scrollY };
        const top = all[i].getBoundingClientRect().top;
        const nextTop =
          all[i + 1]?.getBoundingClientRect().top ??
          els.doc.getBoundingClientRect().bottom;
        return { head: i, frac: (100 - top) / Math.max(1, nextTop - top) };
      }
      function restorePosition(p) {
        if (p.ratio != null) return scrollTo(0, p.ratio * docHeight());
        if (p.head < 0) return scrollTo(0, Math.min(p.y || 0, 400));
        const all = sections();
        const h = all[Math.min(p.head, all.length - 1)];
        if (!h) return;
        const top = h.getBoundingClientRect().top + scrollY;
        const nextTop =
          (all[p.head + 1]?.getBoundingClientRect().top ??
            els.doc.getBoundingClientRect().bottom) + scrollY;
        scrollTo(0, top - 100 + p.frac * (nextTop - top));
        pin(h);
      }

      function scrollToAnchor(anchor, smooth = true) {
        const el = document.getElementById(anchor);
        if (!el) return false;
        el.scrollIntoView({
          behavior: smooth ? "smooth" : "instant",
          block: "start",
        });
        pin(el, parseFloat(getComputedStyle(el).scrollMarginTop) || 0);
        return true;
      }

      const pinned = { el: null, top: 0 };
      function pin(el, top) {
        pinned.el = el;
        pinned.top = top ?? el?.getBoundingClientRect().top ?? 0;
      }
      new ResizeObserver(() => {
        if (!pinned.el?.isConnected) return;
        const d = pinned.el.getBoundingClientRect().top - pinned.top;
        if (Math.abs(d) > 1) scrollBy({ top: d, behavior: "instant" });
      }).observe(els.doc);
      ["wheel", "touchstart", "keydown", "mousedown"].forEach((ev) =>
        addEventListener(ev, () => pin(null), { passive: true, capture: true }),
      );

      function markHits(root, query) {
        const terms = query.split(/\s+/).filter((x) => x.length > 1);
        if (!terms.length) return null;
        const re = new RegExp(terms.map(escRe).join("|"), "gi");
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) =>
            n.parentElement.closest("figure, pre, .h-anchor, mark")
              ? NodeFilter.FILTER_REJECT
              : NodeFilter.FILTER_ACCEPT,
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let first = null;
        for (const n of nodes) {
          const s = n.nodeValue;
          const ms = [...s.matchAll(re)];
          if (!ms.length) continue;
          const frag = document.createDocumentFragment();
          let last = 0;
          for (const mt of ms) {
            frag.append(s.slice(last, mt.index));
            const mk = document.createElement("mark");
            mk.className = "hit";
            mk.textContent = mt[0];
            frag.append(mk);
            first ||= mk;
            last = mt.index + mt[0].length;
          }
          frag.append(s.slice(last));
          n.replaceWith(frag);
        }
        return first;
      }

      const blockText = (tokens) =>
        tokens
          .map((t) =>
            t.type === "code"
              ? /^mermaid\b/i.test((t.lang || "").trim())
                ? ""
                : t.text
              : t.type === "table"
                ? [t.header, ...t.rows]
                    .flat()
                    .map((c) => textOf(c.tokens))
                    .join(" ")
                : t.type === "list"
                  ? t.items.map((it) => blockText(it.tokens)).join(" ")
                  : t.type === "blockquote"
                    ? blockText(t.tokens)
                    : t.type === "html"
                      ? t.text.replace(/<[^>]*>/g, " ")
                      : t.tokens
                        ? textOf(t.tokens)
                        : "",
          )
          .join(" ");

      function ensureCorpus(lang) {
        return memo(S.corpus, lang, async () => {
          const { entries } = await loadIndex(lang);
          const out = {};
          await Promise.all(
            entries.map(async (e) => {
              let text = "";
              try {
                text = blockText(base.lexer(await loadDoc(e)))
                  .replace(/\s+/g, " ")
                  .trim();
              } catch {}
              out[e.id] = { text, lower: text.toLowerCase() };
            }),
          );
          S.text[lang] = out;
          if (lang === S.lang) renderNav();
          return out;
        });
      }

      function highlightText(s, terms) {
        const e = esc(s);
        if (!terms.length) return e;
        return e.replace(
          new RegExp(terms.map((x) => escRe(esc(x))).join("|"), "gi"),
          "<mark>$&</mark>",
        );
      }

      const nav = { key: null, idx: null };
      async function renderNav() {
        const t = T[S.lang];
        const idx = await loadIndex(S.lang);
        const q = S.query.trim().toLowerCase();
        const terms = q.split(/\s+/).filter(Boolean);
        const corpus = S.text[S.lang];
        const cur = S.route?.id;
        const key = [S.lang, q, terms.length > 0 && !!corpus].join("|");
        if (key === nav.key && idx === nav.idx) {
          for (const a of $$(".nav-item", els.nav))
            a.classList.toggle(
              "active",
              a.dataset.id ? a.dataset.id === cur : !cur,
            );
        } else {
          nav.key = key;
          nav.idx = idx;
          let items = idx.entries.map((e) => ({ e, score: 0 }));
          if (terms.length) {
            items = items
              .map(({ e }) => {
                const hay = `${e.id} ${e.title} ${e.summary}`.toLowerCase();
                const head = terms.every((x) => hay.includes(x));
                const body = corpus?.[e.id];
                const inBody =
                  body && terms.every((x) => body.lower.includes(x));
                if (!head && !inBody) return null;
                let snip = "";
                let hits = 0;
                if (inBody) {
                  const key = [...terms].sort((a, b) => b.length - a.length)[0];
                  hits = body.lower.split(key).length - 1;
                  if (
                    !head ||
                    !`${e.id} ${e.title}`.toLowerCase().includes(key)
                  ) {
                    const at = body.lower.indexOf(key);
                    const from = Math.max(0, at - 48);
                    snip =
                      (from ? "…" : "") +
                      highlightText(
                        body.text.slice(from, at + key.length + 90),
                        terms,
                      ) +
                      "…";
                  }
                }
                return { e, score: (head ? 1000 : 0) + hits, snip, hits };
              })
              .filter(Boolean)
              .sort(
                (a, b) => b.score - a.score || a.e.id.localeCompare(b.e.id),
              );
          }
          const list = items
            .map(
              ({ e, snip, hits }) =>
                `<a class="nav-item${e.id === cur ? " active" : ""}" href="${href(e.id)}" data-id="${e.id}"><span class="nav-num">${e.id}</span><span class="nav-title">${highlightText(e.title, terms)}</span>${hits ? `<span class="nav-count">${hits > 99 ? "99+" : hits}</span>` : "<span></span>"}${snip ? `<span class="nav-snip">${snip}</span>` : ""}</a>`,
            )
            .join("");
          els.nav.innerHTML = sanitize(
            `${terms.length ? "" : `<a class="nav-item home${cur ? "" : " active"}" href="${href(null)}"><span class="nav-num">${icon(ICON.home)}</span><span class="nav-title">${t.overview}</span></a>`}<div class="nav-label"><span>${t.decisions}</span><span>${items.length}</span></div>${list || `<div class="nav-empty">${t.none}</div>`}`,
          );
          els.status.textContent = terms.length
            ? corpus
              ? t.results(items.length)
              : t.loadingIdx
            : "";
        }
        const act = $(".nav-item.active:not(.home)", els.nav);
        if (act) reveal(act, els.nav);
      }

      function applyChrome() {
        const t = T[S.lang];
        document.documentElement.lang = S.lang;
        els.input.placeholder = t.search;
        $$(".seg button").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)),
        );
        $(".zoom-hint").textContent = t.zoomHint;
        $(".gh-link").href =
          `https://github.com/${REPO}/tree/${encodeURI(blobRef)}/docs/adr`;
        const pill = $(".ref-pill");
        if (ref) {
          pill.hidden = false;
          pill.href = location.pathname + location.hash;
          pill.title = t.clearRef;
          pill.innerHTML = `${icon(ICON.branch)}<span>${esc(ref)}</span><span class="x">${icon(ICON.x)}</span>`;
        }
      }

      async function route(opts = {}) {
        const r = parseHash();
        const nextLang = r.lang || S.lang;
        const langChanged = nextLang !== S.lang;
        S.lang = nextLang;
        store.set("lang", S.lang);
        const prev = S.route;
        S.route = r;
        document.body.classList.remove("nav-open");
        applyChrome();
        renderNav();
        if (
          !opts.keep &&
          !langChanged &&
          prev &&
          prev.id === r.id &&
          r.id &&
          els.doc.querySelector(".prose")
        ) {
          if (r.anchor) scrollToAnchor(r.anchor);
          return;
        }
        try {
          if (r.id) await showAdr(r.id, r.anchor, opts);
          else await showLanding(opts);
        } catch (e) {
          showState(T[S.lang].fail, `<code>${esc(e.message)}</code>`);
        }
        S.pendingFirst = false;
      }

      function switchLang(l) {
        if (l === S.lang) return;
        const keep = capturePosition();
        history.replaceState(null, "", href(parseHash().id, null, l));
        route({ keep });
        if (S.query) ensureCorpus(l);
      }

      function setTheme(th) {
        document.documentElement.dataset.theme = th;
        const prose = $(".prose", els.doc);
        if (prose && $("figure.diagram", prose)) {
          const keep = capturePosition();
          $$("figure.diagram", prose).forEach((f) => {
            const h = f.offsetHeight;
            f.className = "diagram loading";
            f.style.minHeight = h + "px";
            f.innerHTML = "";
          });
          renderDiagrams(prose).then(() => {
            $$("figure.diagram", prose).forEach(
              (f) => (f.style.minHeight = ""),
            );
            restorePosition(keep);
          });
        }
      }

      const Z = { s: 1, x: 0, y: 0, w: 0, h: 0 };
      const zoomEl = $(".zoom");
      const stage = $(".zoom-stage");
      const canvas = $(".zoom-canvas");
      const applyZoom = () => {
        canvas.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
        $(".zoom-pct").textContent = Math.round(Z.s * 100) + "%";
      };
      function fitZoom(one) {
        const r = stage.getBoundingClientRect();
        const w = Z.w + 48;
        const h = Z.h + 48;
        Z.s = one ? 1 : Math.min((r.width - 64) / w, (r.height - 150) / h, 2.5);
        Z.x = (r.width - w * Z.s) / 2;
        Z.y = (r.height - h * Z.s) / 2 - 10;
        applyZoom();
      }
      function zoomAt(f, cx, cy) {
        const s = Math.min(12, Math.max(0.08, Z.s * f));
        const k = s / Z.s;
        Z.x = cx - (cx - Z.x) * k;
        Z.y = cy - (cy - Z.y) * k;
        Z.s = s;
        applyZoom();
      }
      function zoomCmd(z) {
        const r = stage.getBoundingClientRect();
        if (z === "in") zoomAt(1.25, r.width / 2, r.height / 2);
        if (z === "out") zoomAt(0.8, r.width / 2, r.height / 2);
        if (z === "fit") fitZoom();
        if (z === "one") fitZoom(true);
        if (z === "close") zoomEl.close();
      }
      const ZOOM_KEYS = { "+": "in", "=": "in", "-": "out", 0: "fit" };
      function openZoom(svg) {
        const vb = svg.viewBox?.baseVal;
        const box = svg.getBoundingClientRect();
        Z.w = vb?.width || box.width;
        Z.h = vb?.height || box.height;
        const c = svg.cloneNode(true);
        c.removeAttribute("style");
        c.setAttribute("width", Z.w);
        c.setAttribute("height", Z.h);
        canvas.replaceChildren(c);
        zoomEl.showModal();
        fitZoom();
      }
      zoomEl.addEventListener("close", () => canvas.replaceChildren());
      stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = stage.getBoundingClientRect();
          zoomAt(
            Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0016)),
            e.clientX - r.left,
            e.clientY - r.top,
          );
        },
        { passive: false },
      );
      let drag = null;
      stage.addEventListener("pointerdown", (e) => {
        drag = { x: e.clientX - Z.x, y: e.clientY - Z.y, id: e.pointerId };
        stage.setPointerCapture(e.pointerId);
        stage.classList.add("dragging");
      });
      stage.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        Z.x = e.clientX - drag.x;
        Z.y = e.clientY - drag.y;
        applyZoom();
      });
      const endDrag = () => {
        drag = null;
        stage.classList.remove("dragging");
      };
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);
      stage.addEventListener("dblclick", () => fitZoom());
      $(".zoom-bar").addEventListener("click", (e) =>
        zoomCmd(e.target.closest("[data-z]")?.dataset.z),
      );

      document.addEventListener("click", async (e) => {
        const top = e.target.closest("[data-top]");
        if (top) {
          e.preventDefault();
          scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        const copy = e.target.closest(".copy");
        if (copy) {
          await navigator.clipboard?.writeText(
            $("pre", copy.parentElement).textContent,
          );
          copy.lastChild.textContent = T[S.lang].copied;
          setTimeout(() => (copy.lastChild.textContent = T[S.lang].copy), 1400);
          return;
        }
        const fig = e.target.closest("figure.diagram.ok");
        if (fig) {
          const svg = $('svg[id^="mmd-"]', fig);
          if (svg) openZoom(svg);
          return;
        }
        const a = e.target.closest("a[data-anchor]");
        if (a && S.route?.id) {
          e.preventDefault();
          if (scrollToAnchor(a.dataset.anchor))
            history.replaceState(null, "", href(S.route.id, a.dataset.anchor));
          return;
        }
        const item = e.target.closest(".nav-item[data-id]");
        if (item && S.query.trim()) S.highlight = S.query.trim();
        if (e.target.closest(".scrim"))
          document.body.classList.remove("nav-open");
      });

      $(".seg").addEventListener("click", (e) => {
        const l = e.target.closest("[data-lang]")?.dataset.lang;
        if (l) switchLang(l);
      });
      $(".theme-btn").addEventListener("click", () => {
        const th = isDark() ? "light" : "dark";
        store.set("theme", th);
        setTheme(th);
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        (e) => {
          if (!store.get("theme")) setTheme(e.matches ? "dark" : "light");
        },
      );
      $(".menu-btn").addEventListener("click", () =>
        document.body.classList.toggle("nav-open"),
      );

      let searchTimer = 0;
      els.input.addEventListener("focus", () => ensureCorpus(S.lang));
      els.input.addEventListener("input", () => {
        S.query = els.input.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderNav, 60);
      });
      els.input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const first = $(".nav-item[data-id]", els.nav);
          if (first) {
            S.highlight = S.query.trim() || null;
            location.hash = first.getAttribute("href");
          }
        }
        if (e.key === "Escape") {
          els.input.value = "";
          S.query = "";
          renderNav();
          els.input.blur();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (zoomEl.open) {
          zoomCmd(ZOOM_KEYS[e.key]);
          return;
        }
        if (e.key === "Escape") document.body.classList.remove("nav-open");
        const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
        if (
          !typing &&
          (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key === "k"))
        ) {
          e.preventDefault();
          document.body.classList.add("nav-open");
          els.input.focus();
          els.input.select();
        }
      });
      let resizeRaf = 0;
      addEventListener("resize", () => {
        if (resizeRaf) return;
        resizeRaf = requestAnimationFrame(() => {
          resizeRaf = 0;
          if (zoomEl.open) fitZoom();
          const figs = $$("figure.diagram.ok");
          const widths = figs.map((f) => f.clientWidth);
          figs.forEach((f, i) => fitDiagram(f, widths[i]));
        });
      });
      addEventListener("hashchange", () => route());

      const initial = parseHash();
      S.lang =
        initial.lang ||
        store.get("lang") ||
        ((navigator.languages || [navigator.language]).some((l) =>
          /^ko\b/i.test(l),
        )
          ? "ko"
          : "en");
      if (!initial.lang)
        history.replaceState(null, "", href(initial.id, initial.anchor));
      S.pendingFirst = true;
      route();
    </script>
  </body>
</html>
